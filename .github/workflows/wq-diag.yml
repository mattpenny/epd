name: Diagnose WQ download (temporary)

# TEMPORARY diagnostic for the 2026-11-01 CI failure: in GitHub runners the
# EPD form works but the CSV download never lands ("no csv downloaded" for
# every unit). Runs ONE marine zone (Deep Bay) twice with WQ_DEBUG=1:
#   A) download behaviour attached to the page session (production default)
#   B) download behaviour attached at browser level (WQ_DL_LEVEL=browser)
# and logs the CDP download events either way. Delete this workflow once the
# cause is found; it never commits anything.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wq-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Google Chrome for headless scraping
        run: |
          sudo apt-get update
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          echo "CHROME_PATH=$(which google-chrome)" >> "$GITHUB_ENV"
          google-chrome --version || true
          node --version

      - name: "Verify — real Chrome, production settings, one zone"
        continue-on-error: true
        timeout-minutes: 10
        env:
          WQ_DEBUG: '1'
        run: node tools/build-wq-history.mjs --only=marine --zone="Deep Bay" --years=10
