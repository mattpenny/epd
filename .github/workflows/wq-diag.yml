name: Diagnose WQ download (temporary)

# TEMPORARY diagnostic for the 2026-11-01 CI failure: in GitHub runners the
# EPD form works but the CSV download never lands ("no csv downloaded" for
# every unit). Runs ONE marine zone (Deep Bay) twice with WQ_DEBUG=1:
#   A) download behaviour attached to the page session (production default)
#   B) download behaviour attached at browser level (WQ_DL_LEVEL=browser)
# and logs the CDP download events either way. Delete this workflow once the
# cause is found; it never commits anything.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wq-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium for headless scraping
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "CHROME_PATH=$(which chromium-browser)" >> "$GITHUB_ENV"
          chromium-browser --version || true
          node --version

      - name: "Attempt A — session-level download behaviour (current)"
        continue-on-error: true
        timeout-minutes: 10
        env:
          WQ_DEBUG: '1'
        run: node tools/build-wq-history.mjs --only=marine --zone="Deep Bay" --years=10

      - name: "Attempt B — browser-level download behaviour"
        continue-on-error: true
        timeout-minutes: 10
        env:
          WQ_DEBUG: '1'
          WQ_DL_LEVEL: browser
        run: node tools/build-wq-history.mjs --only=marine --zone="Deep Bay" --years=10
