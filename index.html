<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="香港環保數據地圖 — 空氣質素、泳灘水質、回收點及低噪音路面空間數據">
<title>香港環保數據地圖</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" id="meta-theme-color">
<link rel="icon" href="icons/icon-192.png">

<!-- Leaflet + MarkerCluster (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
/* ============================================================
   主題：CSS 自訂屬性（深色 / 淺色）
   ============================================================ */
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --border-color: #e0e0e0;
  --tab-active: #0066cc;
  --popup-bg: #ffffff;
  --popup-text: #1a1a1a;
  --shadow: 0 2px 10px rgba(0,0,0,.12);
  --shadow-strong: 0 6px 24px rgba(0,0,0,.18);
  --header-h: 60px;
  --bottomnav-h: 0px;
  --subtab-h: 42px;
}
[data-theme="dark"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --text-primary: #eaeaea;
  --text-secondary: #a0a0a0;
  --border-color: #2a2a4a;
  --tab-active: #4da6ff;
  --popup-bg: #1e1e3a;
  --popup-text: #eaeaea;
  --shadow: 0 2px 10px rgba(0,0,0,.5);
  --shadow-strong: 0 6px 24px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}
body { overflow: hidden; }

/* ============================================================
   頂部導航欄
   ============================================================ */
.topbar {
  position: relative; z-index: 1200;
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-color);
}
.brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.brand-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: linear-gradient(135deg, #16a34a, #4da6ff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tab-active) 18%, transparent);
}
.brand h1 {
  font-size: 15px; font-weight: 700; margin: 0; white-space: nowrap;
  letter-spacing: .2px;
}

.tabs {
  display: flex; align-items: stretch; gap: 4px;
  flex: 1 1 auto; overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 12px;
  border: 0; background: transparent; cursor: pointer;
  color: var(--text-secondary); font-size: 13px; font-weight: 600;
  font-family: inherit; white-space: nowrap;
  border-radius: 8px 8px 0 0;
  border-bottom: 3px solid transparent;
  transition: color .18s, background-color .18s, border-color .18s;
}
.tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
.tab[aria-selected="true"] {
  color: var(--tab-active);
  border-bottom-color: var(--tab-active);
  background: color-mix(in srgb, var(--tab-active) 8%, transparent);
}
.tab:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }
.tab .tab-icon { font-size: 15px; line-height: 1; }
.tab .err-dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #e74c3c; box-shadow: 0 0 0 2px var(--bg-primary);
  display: none;
}
.tab.has-error .err-dot { display: block; }
.tab .spinner-mini {
  width: 12px; height: 12px; flex: 0 0 auto;
  border: 2px solid color-mix(in srgb, var(--tab-active) 30%, transparent);
  border-top-color: var(--tab-active);
  border-radius: 50%; animation: spin .8s linear infinite;
  display: none;
}
.tab.is-loading .spinner-mini { display: inline-block; }

/* ============================================================
   子分頁（僅「水質數據」分頁顯示）
   桌面版浮在主分頁列之下；手機版浮在底部導覽列之上（見 media query）。
   只在 body.has-subtabs 時出現，其餘分頁完全不佔位。
   left 由 positionSubTabs() 依「水質數據」分頁的位置設定，此處為後備值。
   ============================================================ */
.sub-tabs {
  position: absolute; z-index: 1150;
  top: calc(var(--header-h) + 7px); left: 12px;
  display: none; align-items: center; gap: 4px;
  height: var(--subtab-h); padding: 4px;
  max-width: calc(100vw - 24px);
  overflow-x: auto; scrollbar-width: none;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); border-radius: 999px;
  box-shadow: var(--shadow);
}
.sub-tabs::-webkit-scrollbar { display: none; }
body.has-subtabs .sub-tabs { display: flex; }

/* 箭嘴：指向子分頁所屬的分頁（桌面指向上方「水質數據」、手機指向下方底部導覽）。
   刻意做成 #sub-tabs 的「兄弟節點」而非子元素 —— .sub-tabs 有 overflow-x: auto，
   子元素會被裁掉；兄弟節點才能露出箭嘴。z-index 較低，下半部藏在膠囊後面。
   位置與旋轉由 positionSubTabs() 設定。 */
.sub-caret {
  position: fixed; z-index: 1149;
  display: none; width: 12px; height: 12px;
  background: var(--popup-bg);
  border-left: 1px solid var(--border-color);
  border-top: 1px solid var(--border-color);
  border-radius: 2px 0 0 0;
  pointer-events: none;
}
body.has-subtabs .sub-caret { display: block; }
.sub-tab {
  flex: 0 0 auto;
  display: inline-flex; align-items: center;
  height: 100%; padding: 0 13px;
  border: 0; border-radius: 999px; background: transparent;
  color: var(--text-secondary); font-family: inherit;
  font-size: 12.5px; font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: color .18s, background-color .18s;
}
.sub-tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
.sub-tab[aria-selected="true"] { color: #fff; background: var(--tab-active); }
.sub-tab:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }

.actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.icon-btn {
  min-width: 44px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-color); border-radius: 10px;
  background: var(--bg-secondary); color: var(--text-primary);
  cursor: pointer; font-size: 15px; font-family: inherit; font-weight: 600;
  transition: background-color .18s, border-color .18s, transform .12s;
}
.icon-btn:hover { border-color: var(--tab-active); color: var(--tab-active); }
.icon-btn:active { transform: scale(.96); }
.icon-btn:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }
#lang-btn { font-size: 12px; letter-spacing: .3px; }

/* ============================================================
   地圖
   ============================================================ */
#map {
  position: absolute; inset: var(--header-h) 0 0 0;
  background: var(--bg-secondary);
  z-index: 1;
}
.leaflet-container { background: var(--bg-secondary); font-family: inherit; }
.leaflet-container a { color: var(--tab-active); }

/* ============================================================
   圖例
   ============================================================ */
.legend {
  position: absolute; right: 12px; bottom: 24px; z-index: 900;
  max-width: 250px;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: 12px; overflow: hidden;
}
.legend-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; font-weight: 700; font-size: 12.5px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  cursor: default;
}
.legend-toggle {
  display: none; border: 0; background: transparent; cursor: pointer;
  color: var(--text-secondary); font-size: 13px; font-family: inherit;
  min-width: 28px; min-height: 28px;
}
.legend-body { padding: 9px 12px 11px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; line-height: 1.35; }
.legend-swatch {
  width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,.18);
}
.legend-line { width: 18px; height: 0; border-top: 3px solid #8e44ad; border-radius: 2px; flex: 0 0 auto; }
.legend-note {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);
  color: var(--text-secondary); font-size: 10.5px; line-height: 1.45;
}
.legend-sub { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border-color); }
.legend-sub label {
  display: flex; align-items: center; gap: 7px; margin: 5px 0;
  cursor: pointer; font-size: 11.5px; color: var(--text-primary);
}
.legend-sub input { accent-color: var(--tab-active); width: 15px; height: 15px; }

/* ============================================================
   Popup（統一 .custom-popup）
   ============================================================ */
.leaflet-popup-content-wrapper {
  background: var(--popup-bg); color: var(--popup-text);
  border-radius: 8px; box-shadow: var(--shadow-strong);
  border: 1px solid var(--border-color);
}
.leaflet-popup-tip { background: var(--popup-bg); border: 1px solid var(--border-color); }
.leaflet-popup-content { margin: 0; }
.leaflet-container a.leaflet-popup-close-button {
  color: var(--text-secondary); font-size: 22px; width: 32px; height: 32px;
  padding: 5px 0 0 0; line-height: 1; z-index: 2;
}
.leaflet-container a.leaflet-popup-close-button:hover { color: var(--text-primary); }

.custom-popup { max-width: 280px; width: 280px; font-size: 13px; color: var(--popup-text); }
.custom-popup .cp-title {
  font-size: 16px; font-weight: 700; line-height: 1.35;
  padding: 12px 34px 8px 13px; margin: 0;
  border-bottom: 1px solid var(--border-color);
}
.custom-popup .cp-body { padding: 10px 13px 12px; }
.custom-popup .cp-row { display: flex; gap: 8px; margin: 6px 0; line-height: 1.45; }
.custom-popup .cp-label {
  flex: 0 0 auto; min-width: 84px; color: var(--text-secondary); font-size: 12px;
}
.custom-popup .cp-value { flex: 1 1 auto; word-break: break-word; }
.custom-popup .cp-address { color: var(--text-secondary); font-size: 12px; }
.custom-popup .cp-sub { color: var(--text-secondary); font-size: 11.5px; margin-top: 2px; }

/* 彩色標籤：關鍵數值 */
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-weight: 700; font-size: 12.5px; color: #fff; line-height: 1.5;
  white-space: nowrap;
}
.badge.aqhi-1 { background: #009e49; }
.badge.aqhi-2 { background: #f2c200; color: #3a2f00; }
.badge.aqhi-3 { background: #f28c00; }
.badge.aqhi-4 { background: #e02020; }
.badge.aqhi-5 { background: #8b0000; }
/* 泳灘等級徽章不在此處上色：色碼由 JS 的 BEACH_COLOR 對照表提供並以
   inline style 套用，確保圖例色塊、Popup 徽章、地圖標記三者永遠一致。
   等級 1 為淺青而非綠色（官方 EPD 慣例），文字色因此隨等級而異。 */
/* 量測值徽章（溶解氧／五天生化需氧量）：中性色 —— 官方沒有等級評級，
   不可借用等級色盤，否則會誤導成「官方分級」。 */
.badge.badge-param {
  background: var(--bg-secondary); color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.custom-popup .cp-foot {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color);
  color: var(--text-secondary); font-size: 10.5px; line-height: 1.5;
}
.custom-popup .cp-desc {
  color: var(--text-secondary); font-size: 11px; line-height: 1.5;
  margin: 0 0 8px; font-style: italic;
}
.custom-popup .cp-desc + .cp-title { border-top: 0; }

/* MarkerCluster 主題化 */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
  background-color: color-mix(in srgb, var(--tab-active) 28%, transparent);
}
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background-color: var(--tab-active); color: #fff; font-weight: 700;
}
.marker-cluster { border-radius: 50%; }

/* L10 噪音影像為灰階圖（黑色代表無資料／低噪音）。
   用 screen 混合模式讓黑色「消失」、亮部疊加在地圖上，讀起來像熱力圖。 */
.l10-tile { mix-blend-mode: screen; }

/* 自訂標記 */
.pin {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); border: 2px solid #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
}
.pin span { transform: rotate(45deg); font-size: 10px; line-height: 1; color: #fff; }

/* ============================================================
   載入指示器
   ============================================================ */
.loading {
  position: absolute; left: 50%; top: calc(var(--header-h) + 16px);
  transform: translateX(-50%); z-index: 1100;
  display: none; align-items: center; gap: 10px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); box-shadow: var(--shadow);
  font-size: 12.5px; font-weight: 600;
}
.loading.show { display: flex; }
.spinner {
  width: 16px; height: 16px; flex: 0 0 auto;
  border: 2.5px solid color-mix(in srgb, var(--tab-active) 25%, transparent);
  border-top-color: var(--tab-active);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast（錯誤提示） */
.toast {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
  z-index: 1300; opacity: 0; pointer-events: none;
  max-width: min(90vw, 420px);
  padding: 10px 16px; border-radius: 10px;
  background: #b3261e; color: #fff; font-size: 12.5px; line-height: 1.45;
  box-shadow: var(--shadow-strong);
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* A2HS 提示 */
.a2hs {
  position: absolute; right: 12px; top: calc(var(--header-h) + 12px); z-index: 1150;
  display: none; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); box-shadow: var(--shadow);
  font-size: 12px; font-family: inherit; font-weight: 600;
}
.a2hs.show { display: flex; }
.a2hs .close-x {
  border: 0; background: transparent; color: var(--text-secondary);
  cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px;
}

/* 螢幕閱讀器專用 */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ============================================================
   響應式：平板 768–1024
   ============================================================ */
@media (max-width: 1024px) {
  .brand h1 { font-size: 14px; }
  .tab .tab-label { display: none; }
  .tab { padding: 0 14px; }
  .tab .tab-icon { font-size: 18px; }
  .custom-popup { max-width: 260px; width: 260px; }
}

/* ============================================================
   響應式：手機 < 768 → 底部導航欄
   ============================================================ */
@media (max-width: 767px) {
  :root { --header-h: 52px; --bottomnav-h: 60px; }
  .topbar { padding: 0 10px; }
  .brand h1 { font-size: 13px; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: none; }                       /* 手機隱藏頂部 Tab */

  .actions { margin-left: auto; }
  .icon-btn { min-width: 40px; min-height: 40px; border-radius: 9px; }

  #map { inset: var(--header-h) 0 calc(var(--bottomnav-h) + env(safe-area-inset-bottom)) 0; }

  /* 底部導航欄 */
  .bottom-nav {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1200;
    display: flex; align-items: stretch;
    height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg-primary);
    border-top: 1px solid var(--border-color);
  }
  .bottom-nav .tab {
    flex: 1 1 0; flex-direction: column; gap: 3px;
    justify-content: center; min-height: 44px; padding: 4px 2px;
    border-radius: 0; border-bottom: 0; border-top: 3px solid transparent;
    font-size: 10px;
  }
  .bottom-nav .tab[aria-selected="true"] {
    border-top-color: var(--tab-active); background: transparent;
  }
  .bottom-nav .tab .tab-icon { font-size: 19px; }
  .bottom-nav .tab .tab-label { display: block; max-width: 22vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottom-nav .tab .err-dot { top: 5px; right: 22%; }

  /* 手機：圖例可折疊（抬到底部導航欄之上） */
  .legend {
    right: 8px; left: 8px; max-width: none;
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px);
    max-height: 46vh; overflow-y: auto;
  }
  /* 手機：子分頁浮在底部導覽列之上（左緣對齊「水質數據」按鈕，由 JS 設定）；
     圖例與提示再往上讓開，避免疊在一起 */
  .sub-tabs {
    top: auto; left: 8px; right: auto; max-width: calc(100vw - 16px); z-index: 1250;
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px);
  }
  /* 手機：箭嘴改指向下方的底部導覽列。
     注意：只改「旋轉」（由 JS 設為 225°），不可再改邊框所在的一側 ——
     邊框留在上／左，轉 225° 後尖端自然朝下；兩者都改會互相抵銷。 */
  body.has-subtabs .legend {
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px + var(--subtab-h) + 6px);
  }
  body.has-subtabs .toast {
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 12px + var(--subtab-h) + 6px);
  }
  .legend.collapsed .legend-body { display: none; }
  .legend-toggle { display: inline-flex; align-items: center; justify-content: center; }
  .legend-head { cursor: pointer; position: sticky; top: 0; background: var(--bg-secondary); }

  /* 手機：Popup 字體縮小、關閉按鈕加大 */
  .custom-popup { max-width: 90vw; width: 90vw; font-size: 12px; }
  .custom-popup .cp-title { font-size: 15px; padding-right: 38px; }
  .custom-popup .cp-label { min-width: 72px; font-size: 11.5px; }
  .leaflet-container a.leaflet-popup-close-button {
    font-size: 26px; width: 40px; height: 40px; padding-top: 7px;
  }
  .a2hs { top: auto; bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px); }
  .toast { bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 12px); }
}
@media (min-width: 768px) { .bottom-nav { display: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-dot" aria-hidden="true"></span>
    <h1 id="app-title">香港環保數據地圖</h1>
  </div>

  <nav class="tabs" role="tablist" id="tabs" aria-label="數據圖層"></nav>

  <div class="actions">
    <button class="icon-btn" id="theme-btn" type="button"
            aria-label="切換深色/淺色模式" title="切換深色/淺色模式">🌙</button>
    <button class="icon-btn" id="lang-btn" type="button"
            aria-label="切換語言 中文/English" title="切換語言">中 / EN</button>
  </div>
</header>

<nav class="sub-tabs" role="tablist" id="sub-tabs" aria-label="水質數據子分頁"></nav>
<span class="sub-caret" id="sub-caret" aria-hidden="true"></span>

<main id="map" role="application" aria-label="香港環保數據地圖"></main>

<nav class="bottom-nav" role="tablist" id="bottom-nav" aria-label="數據圖層"></nav>

<aside id="legend" class="legend" aria-live="polite" aria-label="圖例">
  <div class="legend-head" id="legend-head">
    <span id="legend-title">圖例</span>
    <button class="legend-toggle" id="legend-toggle" type="button"
            aria-expanded="false" aria-controls="legend-body">▾</button>
  </div>
  <div class="legend-body" id="legend-body"></div>
</aside>

  function debounce(fn, ms) {
    let timer = null;
    return function (...args) {

  /* ======================================================================
     5. 24 小時 localStorage 數據緩存
     ====================================================================== */
  const cache = {
    get(key, ttl) {
      try {
        const raw = localStorage.getItem('hk-env-cache:' + key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || typeof obj.ts !== 'number') return null;
        if (Date.now() - obj.ts > (ttl || CACHE_TTL)) {
          localStorage.removeItem('hk-env-cache:' + key);
          return null;
        }
        return obj.data;
      } catch (e) { return null; }
    },
    set(key, data) {
      try {
        localStorage.setItem('hk-env-cache:' + key,
          JSON.stringify({ ts: Date.now(), data: data }));
        return true;
      } catch (e) {
        // 超出配額：清掉舊快取後重試一次，仍失敗則放棄（不影響功能）
        try {
          Object.keys(localStorage)
            .filter((k) => k.indexOf('hk-env-cache:') === 0)
            .forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('hk-env-cache:' + key,
            JSON.stringify({ ts: Date.now(), data: data }));
          return true;
        } catch (e2) {
          console.warn('[cache] 無法寫入 localStorage（可能超出配額），已略過快取：', key);
          return false;
        }
      }
    }
  };

  /* ======================================================================
     6. 資料抓取
     ====================================================================== */
  /* CSDI 的 ArcGIS 服務由多台後端負載平衡，實測同一請求約有 20–30% 機會
     回傳 404 或 HTTP 200 + 錯誤主體（例如「Service ... not found」）。
     因此對這類暫時性錯誤加入指數退避重試。 */
  function NetError(message, retriable) {
    const e = new Error(message);
    e.retriable = !!retriable;
    return e;
  }

  async function fetchJson(url, tries) {
    const maxTries = tries || 6;
    let lastErr;
    for (let i = 0; i < maxTries; i++) {
      try {
        return await fetchJsonOnce(url);
      } catch (e) {
        lastErr = e;
        if (!e.retriable || i === maxTries - 1) throw e;
        await new Promise((r) => setTimeout(r, 300 * Math.pow(1.8, i)));
      }
    }
    throw lastErr;
  }

  async function fetchJsonOnce(url) {
    let res;
    try {
      res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    } catch (e) {
      throw NetError('網絡錯誤：' + (e && e.message ? e.message : e), true);
    }
    if (!res.ok) {
      const retriable = res.status === 404 || res.status === 408 || res.status === 425 ||
        res.status === 429 || res.status >= 500;
      throw NetError('HTTP ' + res.status, retriable);
    }
    const text = await res.text();
    const trimmed = text.trimStart();
    if (!(trimmed.startsWith('{') || trimmed.startsWith('['))) {
      throw NetError('回應不是 JSON（可能被閘道攔截）', true);
    }
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw NetError('JSON 解析失敗', true); }

    // ArcGIS / 政府 API 的錯誤會以 HTTP 200 + JSON 錯誤主體回傳，
    // 必須明確攔截，否則會靜默地變成「0 筆」這種看似正常的錯誤結果。
    if (data && data.error) {
      const msg = (data.error && (data.error.message || data.error.details)) || '服務回報錯誤';
      const transient = /not found|timeout|unavailable|busy|try again|overloaded/i.test(String(msg));
      throw NetError('API 錯誤：' + msg, transient);
    }
    return data;
  }

  /* Esri JSON → GeoJSON（ArcGIS query 使用 f=json 輸出） */
  function esriToGeoJson(esri) {
    if (!esri || !Array.isArray(esri.features)) {
      throw NetError('API 錯誤：回應缺少 features 陣列', true);
    }
    const features = esri.features.map((f) => {
      const a = f.attributes || {};
      const g = f.geometry;
      let geometry = null;
      if (g) {
        if (typeof g.x === 'number' && typeof g.y === 'number') {
          geometry = { type: 'Point', coordinates: [g.x, g.y] };
        } else if (Array.isArray(g.paths)) {
          geometry = g.paths.length === 1
            ? { type: 'LineString', coordinates: g.paths[0] }
            : { type: 'MultiLineString', coordinates: g.paths };
        } else if (Array.isArray(g.rings)) {
          geometry = { type: 'Polygon', coordinates: g.rings };
        }
      }
      return { type: 'Feature', geometry: geometry, properties: a };
    });
    return { type: 'FeatureCollection', features: features };
  }

  /* ArcGIS 圖層取得（必要時分頁；Esri JSON 轉 GeoJSON） */
  async function fetchArcLayer(cfg) {
    const pageSize = cfg.pageSize || 3000;
    const out = [];
    let offset = 0;
    for (let guard = 0; guard < 40; guard++) {
      const url = cfg.url + `&resultOffset=${offset}&resultRecordCount=${pageSize}`;
      const esri = await fetchJson(url);
      const fc = esriToGeoJson(esri);
      out.push(...fc.features);
      const more = esri.exceededTransferLimit === true && fc.features.length >= pageSize;
      if (!more) break;
      offset += pageSize;
    }
    return { type: 'FeatureCollection', features: out };
  }

  /* 帶快取的 JSON 取得（供 AQHI 等非 GeoJSON 資料使用） */
  async function getCachedJson(cacheKey, url, ttl) {
    let data = cache.get(cacheKey, ttl);
    let fromCache = !!data;
    if (!data) {
      data = await fetchJson(url);
      cache.set(cacheKey, data);
    }
    console.log(`[效能] ${cacheKey}：${Array.isArray(data) ? data.length : '—'} 筆` +
      `${fromCache ? '（來自快取）' : '（網絡請求）'}`);
    return data;
  }

  /* 帶快取的圖層資料取得 */
  async function getLayerData(id) {
    const cfg = DATA[id];
    const started = performance.now();
    let data = cfg.cacheKey ? cache.get(cfg.cacheKey, cfg.cacheTtl) : null;
    let fromCache = !!data;

    if (!data) {
      data = cfg.arcgis ? await fetchArcLayer(cfg) : await fetchJson(cfg.url);
      if (cfg.cacheKey && data.features && data.features.length) cache.set(cfg.cacheKey, data);
    }
    const ms = Math.round(performance.now() - started);
    console.log(`[效能] ${t('datasetNames.' + cfg.datasetKey)}：${data.features ? data.features.length : '—'} 筆，` +
      `${ms} ms${fromCache ? '（來自 24 小時快取）' : '（網絡請求）'}`);
    return data;
  }

  /* 監測站名稱對照：AQMN 的 Facility_Name → AQHI 數據的 station
     （兩個來源的識別碼不同，必須明確對照，不可直接互相代入） */
  function stationKey(facilityName) {
    return String(facilityName || '')

  /* 空氣質素健康指數 → 健康風險級別（官方五級：低、中、高、甚高、嚴重） */
  function riskLevelOf(aqhi) {
    const v = Number(aqhi);
    if (!isFinite(v)) return null;
    if (v >= 11) return 'serious';    // 10+
    if (v >= 8) return 'veryHigh';    // 8–10
    if (v >= 7) return 'high';        // 7
    if (v >= 4) return 'moderate';    // 4–6
    return 'low';                     // 1–3

  /* AQHI 數值 → 顏色級別（1-3 綠 / 4-6 黃 / 7 橙 / 8-10 紅 / 10+ 深紅） */

    const v = Number(aqhi);
    if (!isFinite(v)) return 'aqhi-1';
    if (v >= 11) return 'aqhi-5';
    if (v >= 8) return 'aqhi-4';
    if (v >= 7) return 'aqhi-3';
    if (v >= 4) return 'aqhi-2';
    return 'aqhi-1';
  }
  const AQHI_COLOR = { 'aqhi-1': '#009e49', 'aqhi-2': '#f2c200', 'aqhi-3': '#f28c00', 'aqhi-4': '#e02020', 'aqhi-5': '#8b0000' };

  /* 「現況」由官方 VALIDITY（"YYYY-MM-DD - YYYY-MM-DD"）與今日日期推算。
     這不是數據集原有欄位，UI 上必須標明是推算值。 */
  const CNP_STATUS_KEY = { active: 'permitActive', expired: 'permitExpired', upcoming: 'permitUpcoming' };
  function cnpStatus(p) {
    const m = String(p.VALIDITY || '').match(/(\d{4}-\d{2}-\d{2})\s*-\s*(\d{4}-\d{2}-\d{2})/);
    if (!m) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(m[1] + 'T00:00:00');
    const end = new Date(m[2] + 'T23:59:59');
    if (isNaN(start) || isNaN(end)) return null;
    if (today < start) return 'upcoming';
    if (today > end) return 'expired';
    return 'active';
  }

  function clusterIfNeeded(layer, count) {
    if (count > CLUSTER_THRESHOLD) {
      console.log(`[效能] ${count} 個要素 > ${CLUSTER_THRESHOLD}，啟用 markercluster 聚合`);
    }
    return layer;
  }

  function makeClusterGroup() {
    return L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      chunkedLoading: true,
      chunkInterval: 200,
      maxClusterRadius: 55,
      disableClusteringAtZoom: 16,
      iconCreateFunction: function (cluster) {
        const n = cluster.getChildCount();
        const size = n < 10 ? 'small' : (n < 100 ? 'medium' : 'large');
        return L.divIcon({
          html: `<div><span>${n}</span></div>`,
          className: 'marker-cluster marker-cluster-' + size,
          iconSize: L.point(40, 40)
        });
      }
    });
  }

  /* ---- 空氣質素圖層（API + 空間關聯） ---- */
  async function loadAirLayer() {
    const [geo, aqhiList] = await Promise.all([
      getLayerData('air'),
      getCachedJson(DATA.aqhi.cacheKey, DATA.aqhi.url, DATA.aqhi.cacheTtl).catch((e) => {
        console.warn('[空氣] AQHI 數據取得失敗，只顯示監測站位置：', e);
        return null;
      })
    ]);

    const byKey = {};
    if (Array.isArray(aqhiList)) {
      aqhiList.forEach((a) => { byKey[String(a.station).trim()] = a; });
      state.aqhi = aqhiList;
    }

    // 對照檢查：確認每個監測站都能在 AQHI 資料中找到對應
    const unmatched = [];
    const group = makeClusterGroup();
    let matched = 0;

    const layer = L.geoJSON(geo, {
      pointToMarker: true,
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        const key = stationKey(p.Facility_Name);
        const a = byKey[key];
        if (a) matched++; else unmatched.push(p.Facility_Name);
        const aqhiVal = a ? a.aqhi : null;
        const color = aqhiVal != null ? AQHI_COLOR[aqhiClass(aqhiVal)] : '#7f8c8d';
        lyr.setIcon(pinIcon(color, '🌬'));
        lyr.bindPopup(() => airPopup(p, a), { className: 'custom-popup-wrap', maxWidth: 300, autoPan: true, autoPanPadding: [30, 60] });
        // 同上：tooltip 延遲求值，避免切換語言後殘留舊語言
        lyr.bindTooltip(() => esc(state.lang === 'tc'
          ? (p['設施名稱'] || p.Facility_Name)
          : (p.Facility_Name || p['設施名稱'])), { direction: 'top', offset: [0, -20] });
      },
      filter: (f) => f.geometry && f.geometry.type === 'Point'
    });

    // 逐個加入 cluster group
    layer.eachLayer((l) => group.addLayer(l));

    if (unmatched.length) {
      console.warn(`[空氣] 有 ${unmatched.length} 個監測站未能對應 AQHI 資料：`, unmatched);
    } else if (Array.isArray(aqhiList)) {
      console.log(`[空氣] AQHI 對照成功：${matched}/${layer.getLayers().length} 個監測站`);
    }

    state.meta.air = fmtDateTime(new Date());
    return clusterIfNeeded(group, layer.getLayers().length);
  }

  /* L10 2020 影像圖層（ArcGIS export 逐格抓取） */
  function buildL10Layer() {
    const L10Grid = L.GridLayer.extend({
      createTile: function (coords, done) {
        const tile = document.createElement('img');
        tile.alt = '';
        tile.setAttribute('role', 'presentation');
        const size = this.getTileSize();
        const b = this._tileCoordsToBounds(coords);
        const p1 = L.CRS.EPSG3857.project(b.getNorthWest());
        const p2 = L.CRS.EPSG3857.project(b.getSouthEast());
        const bbox = [p1.x, p2.y, p2.x, p1.y].map((v) => v.toFixed(1)).join(',');
        const url = `${DATA.l10.exportUrl}?bbox=${bbox}&bboxSR=3857&imageSR=3857` +
          `&size=${size.x},${size.y}&format=png32&transparent=true&f=image&dpi=96`;
        tile.onload = () => done(null, tile);
        tile.onerror = () => done(new Error('L10 tile'), tile);
        tile.src = url;
        return tile;
      }
    });
    return new L10Grid({
      opacity: 0.9, minZoom: 9, maxZoom: 19,
      className: 'l10-tile',
      attribution: '噪音地圖：環境保護署'
    });
  }

  function renderLegend() {
    const lid = activeLayerId();
    const def = LEGEND_DEFS[lid] ? LEGEND_DEFS[lid]() : null;

    const bodyEl = $('#legend-body');
    if (!def) { titleEl.textContent = t('legend.title'); bodyEl.innerHTML = ''; return; }
    titleEl.textContent = def.title;

    let html = '';
    def.rows.forEach((r) => {
      const sw = r.type === 'line'
        ? `<span class="legend-line" style="border-top-color:${r.color}"></span>`
        : `<span class="legend-swatch" style="background:${r.color}"></span>`;
      html += `<div class="legend-row">${sw}<span>${esc(r.label)}</span></div>`;
    });
    if (def.note) html += `<div class="legend-note">${def.note}</div>`;
    if (def.sub) {
      html += `<div class="legend-sub">` + def.sub.map((s) =>
        `<label><input type="checkbox" data-sub="${s.id}" ${s.checked ? 'checked' : ''}> ${esc(s.label)}</label>`
      ).join('') + `</div>`;
    }
    bodyEl.innerHTML = html;

    bodyEl.querySelectorAll('input[data-sub]').forEach((cb) => {
      cb.addEventListener('change', () => toggleNoiseSub(cb.dataset.sub, cb.checked));
    });
  }

  function toggleNoiseSub(id, on) {
    state.noiseSub[id] = on;
    if (state.active !== 'noise') return;
    if (id === 'lnrs') {
      if (on) { if (layers.noise) map.addLayer(layers.noise); }
      else if (layers.noise) map.removeLayer(layers.noise);
    }
    if (id === 'l10') {
      if (!l10Layer) l10Layer = buildL10Layer();
      if (on) map.addLayer(l10Layer); else map.removeLayer(l10Layer);
    }
  }

  /* ======================================================================
     12. Tab 切換
     ====================================================================== */
  function buildTabs() {
    const mk = (container) => {
      container.innerHTML = TABS.map((tb) => `
        <button class="tab" type="button" role="tab" id="tab-${tb.id}"
                data-tab="${tb.id}" aria-selected="false" tabindex="-1"
                aria-controls="map" title="${esc(t('tabs.' + tb.id))}">
          <span class="tab-icon" aria-hidden="true">${tb.icon}</span>
          <span class="tab-label">${esc(t('tabs.' + tb.id))}</span>
          <span class="spinner-mini" aria-hidden="true"></span>
          <span class="err-dot" aria-hidden="true"></span>
        </button>`).join('');
    };
    mk($('#tabs'));
    mk($('#bottom-nav'));

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => onTabClick(btn.dataset.tab));
      btn.addEventListener('keydown', onTabKeydown);
    });
    updateSubTabs();
  }

  /* 子分頁只在「水質數據」分頁出現；同時切換 body 的 has-subtabs，
     讓 CSS 決定顯示與否（桌面在主分頁之下、手機在底部導覽之上）。 */
  function updateSubTabs() {
    const nav = $('#sub-tabs');
    if (!nav) return;
    const tab = TABS.filter((x) => x.id === state.active)[0];
    const subs = tab && tab.subs;
    document.body.classList.toggle('has-subtabs', !!subs);
    nav.setAttribute('aria-label', t('ui.subTabsLabel'));
    if (!subs) { nav.innerHTML = ''; return; }

    nav.innerHTML = subs.map((sid) => {
      const on = sid === state.waterSub;
      return `<button class="sub-tab" type="button" role="tab" data-sub="${sid}"
                aria-selected="${on ? 'true' : 'false'}" tabindex="${on ? 0 : -1}"
                title="${esc(t('subs.' + sid))}">${esc(t('subs.' + sid))}</button>`;
    }).join('');

    nav.querySelectorAll('.sub-tab').forEach((b) => {
      b.addEventListener('click', () => onSubClick(b.dataset.sub));
      b.addEventListener('keydown', onSubKeydown);
    });
    positionSubTabs();
  }

  /* 把子分頁列對齊「水質數據」分頁：桌面對齊頂部分頁列、手機對齊底部導覽列，
     箭嘴擺在該分頁的水平中線上，讓使用者一眼看出子分頁隸屬於誰。
     座標取自 getBoundingClientRect()；本頁 body 為 overflow:hidden 不滾動，
     故視窗座標即絕對座標（箭嘴用 position:fixed 進一步保證一致）。 */
  function positionSubTabs() {
    const nav = $('#sub-tabs');
    if (!nav || !document.body.classList.contains('has-subtabs')) return;

    const mobile = window.matchMedia('(max-width: 767px)').matches;
    // 取「實際可見」的那一組分頁按鈕（手機＝底部導覽、桌面＝頂部分頁列）
    const anchor = document.querySelector(
      mobile ? '#bottom-nav .tab[data-tab="water"]' : '#tabs .tab[data-tab="water"]');
    if (!anchor || !anchor.getClientRects().length) return;

    const a = anchor.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const w = nav.offsetWidth;
    // 左緣對齊分頁左緣，再往內夾住，確保整列不超出視窗
    const left = Math.round(Math.max(8, Math.min(a.left, vw - w - 8)));
    nav.style.left = left + 'px';
    nav.style.right = 'auto';

    const caret = $('#sub-caret');
    if (!caret) return;
    const pr = nav.getBoundingClientRect();
    const cx = a.left + a.width / 2;
    // 箭嘴以分頁中心為準，但不可越出子分頁列本身
    caret.style.left = Math.round(Math.max(left + 14, Math.min(cx, left + w - 14))) + 'px';
    /* 12×12 方塊轉 45°（或 225°）後，尖端比版面框再外伸約 2.5px；
       這兩個數值讓尖端剛好觸及頂部分頁列的底邊／底部導覽的頂邊。 */
    caret.style.top = (mobile ? pr.bottom - 4.5 : pr.top - 4.5) + 'px';
    caret.style.transform = `translateX(-50%) rotate(${mobile ? 225 : 45}deg)`;
  }

  const onSubClick = debounce(function (sub) {
    if (!sub || sub === state.waterSub) return;
    state.waterSub = sub;
    updateSubTabs();
    activate(state.active);
  }, DEBOUNCE_MS);

  function onSubKeydown(e) {
    const keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    const list = (TABS.filter((x) => x.id === state.active)[0] || {}).subs || [];
    if (!list.length) return;
    let i = list.indexOf(state.waterSub);
    if (e.key === 'ArrowRight') i = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft') i = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = list.length - 1;
    const target = document.querySelector(`.sub-tab[data-sub="${list[i]}"]`);
    if (target) { target.focus(); onSubClick(list[i]); }
  }

  function onTabKeydown(e) {
    const keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    const list = TABS.map((x) => x.id);
    let i = list.indexOf(state.active);
    if (e.key === 'ArrowRight') i = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft') i = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = list.length - 1;
    const target = document.querySelector(`.tab[data-tab="${list[i]}"]`);
    if (target) { target.focus(); onTabClick(list[i]); }
  }

  function setTabState(id) {
    document.querySelectorAll('.tab').forEach((b) => {
      const on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
  }

  /* 載入中／錯誤指示掛在「分頁」上，但 ensureLayer 傳入的是「圖層」id，
     所以水質數據的三個子圖層都要映射回 water 分頁。 */
  function setTabLoading(layerId, on) {
    const tabId = tabOfLayer(layerId);
    document.querySelectorAll(`.tab[data-tab="${tabId}"]`).forEach((b) => b.classList.toggle('is-loading', !!on));
    /* 轉圈圖示（12px + 6px 間距）會把分頁撐寬 18px，連帶推移右邊的分頁。
       若「水質數據」左邊的分頁正在載入，子分頁列就會偏掉，故立即重新對齊。 */
    positionSubTabs();
  }
  function setTabError(layerId, on) {
    const tabId = tabOfLayer(layerId);
    document.querySelectorAll(`.tab[data-tab="${tabId}"]`).forEach((b) => {
      b.classList.toggle('has-error', !!on);
      if (on) b.title = `${t('tabs.' + tabId)} — ${t('ui.errorHint')}`;
      else b.title = t('tabs.' + tabId);
    });
  }

  function showLoading(on, text) {
    const el = $('#loading');
    if (on) { $('#loading-text').textContent = text || t('ui.loading'); el.classList.add('show'); }
    else el.classList.remove('show');
  }

  /* 移除地圖上所有已存在圖層 */
  function clearMapLayers() {
    Object.keys(layers).forEach((k) => {
      if (layers[k] && map.hasLayer(layers[k])) map.removeLayer(layers[k]);
    });
    if (l10Layer && map.hasLayer(l10Layer)) map.removeLayer(l10Layer);
  }

  /* 確保圖層已載入（失敗時記錄錯誤並回傳 null） */
  async function ensureLayer(id) {
    if (state.loaded[id]) return layers[id];
    if (state.loading[id]) return state.loading[id];
    const task = (async () => {
      setTabLoading(id, true);
      try {
        let lyr;
        if (id === 'air') lyr = await loadAirLayer();
        else if (id === 'beach') lyr = await loadBeachLayer();
        else if (id === 'marine') lyr = await loadMarineLayer();
        else if (id === 'river') lyr = await loadRiverLayer();
        else if (id === 'recycle') lyr = await loadRecycleLayer();
        else if (id === 'noise') lyr = await loadNoiseLayer();
        else if (id === 'cnp') lyr = await loadCnpLayer();
        layers[id] = lyr;
        state.loaded[id] = true;
        state.errors[id] = false;
        setTabError(id, false);
        return lyr;
      } catch (e) {
        state.errors[id] = true;
        setTabError(id, true);
        // 錯誤訊息用資料集名稱（tabs.<layerId> 對子圖層並不存在）
        const nm = t('datasetNames.' + DATA[id].datasetKey);
        console.error(`[圖層錯誤] ${nm}：`, e);
        toast(t('ui.errorLayer').replace('{name}', nm));
        return null;
      } finally {
        setTabLoading(id, false);
        state.loading[id] = null;
      }
    })();
    state.loading[id] = task;
    return task;
  }

  const isMobile = () => window.matchMedia('(max-width: 767px)').matches;

  /* 手機版：圖例預設折疊（桌面版一律展開） */
  function setLegendCollapsed(collapsed) {
    const el = $('#legend');
    const btn = $('#legend-toggle');
    el.classList.toggle('collapsed', !!collapsed);
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    btn.textContent = collapsed ? '▸' : '▾';
  }

  /* 依視口寬度同步手機版 UI（首次載入與尺寸變化時呼叫） */
  function syncMobileUI() {
    if (isMobile()) {
      if (!legendTouched) setLegendCollapsed(true);
    } else {
      setLegendCollapsed(false);
    }
  }

  async function activate(id) {
    state.active = id;
    setTabState(id);
    updateSubTabs();
    clearMapLayers();

    /* 分頁只決定「顯示哪一組」，實際要載入的圖層由 activeLayerId() 決定 */
    const lid = activeLayerId();
    if (!state.loaded[lid]) {
      showLoading(true, t('ui.loadingLayer').replace('{name}', t('datasetNames.' + DATA[lid].datasetKey)));
    }
    const lyr = await ensureLayer(lid);
    showLoading(false);

    if (lyr) {
      map.addLayer(lyr);
      activeLayer = lyr;
      if (lid === 'noise') {
        if (state.noiseSub.l10) {
          if (!l10Layer) l10Layer = buildL10Layer();
          map.addLayer(l10Layer);
        }
        if (!state.noiseSub.lnrs && layers.noise) map.removeLayer(layers.noise);
      }
    }
    renderLegend();
    if (isMobile() && !legendTouched) setLegendCollapsed(true);
  }

  const onTabClick = debounce(function (id) {
    if (!id || id === state.active) return;
    activate(id);
  }, DEBOUNCE_MS);

  /* ======================================================================
     13. 主題切換
     ====================================================================== */
  function applyTheme(theme, persist) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    const meta = $('#meta-theme-color');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1a2e' : '#ffffff');
    const btn = $('#theme-btn');
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    btn.setAttribute('aria-label', theme === 'dark' ? t('ui.themeLight') : t('ui.themeDark'));
    btn.title = btn.getAttribute('aria-label');

    // 底圖替換
    if (map) {
      if (basemapLayer) { map.removeLayer(basemapLayer); basemapLayer = null; }
      if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }

      if (theme === 'dark') {
        basemapLayer = L.layerGroup([
          L.tileLayer(BASEMAP.darkBase, { maxZoom: 19, attribution: DARK_ATTR }),
          L.tileLayer(BASEMAP.darkRef, { maxZoom: 19 })
        ]).addTo(map);
        // Esri 深色底圖本身已含地名，無需另加政府地名圖層
      } else {
        basemapLayer = L.tileLayer(BASEMAP.light, {
          maxZoom: 19, maxNativeZoom: 19, attribution: GOV_ATTR
        }).addTo(map);
        labelLayer = L.tileLayer(state.lang === 'tc' ? BASEMAP.labelTc : BASEMAP.labelEn, {
          maxZoom: 19, maxNativeZoom: 19, pane: 'shadowPane', opacity: 0.95
        }).addTo(map);
      }
      if (basemapLayer.bringToBack) basemapLayer.bringToBack();
      else if (basemapLayer.eachLayer) basemapLayer.eachLayer((l) => l.bringToBack && l.bringToBack());
    }
    if (persist) { try { localStorage.setItem(STORAGE.theme, theme); } catch (e) {} }
  }

  /* ======================================================================
     14. 語言切換
     ====================================================================== */
  function applyLang(lang, persist) {
    state.lang = lang;
    document.documentElement.setAttribute('lang', lang === 'tc' ? 'zh-Hant' : 'en');
    document.title = t('title');

    // 標題與按鈕
    $('#app-title').textContent = t('title');
    const langBtn = $('#lang-btn');
    langBtn.textContent = lang === 'tc' ? '中 / EN' : 'EN / 中';
    langBtn.setAttribute('aria-label', t('ui.langSwitch'));

    // Tab 文字
    document.querySelectorAll('.tab').forEach((b) => {
      const id = b.dataset.tab;
      const lbl = b.querySelector('.tab-label');
      if (lbl) lbl.textContent = t('tabs.' + id);
      // 錯誤狀態以「圖層」為鍵；水質數據分頁看當前子分頁
      const errLid = id === 'water' ? state.waterSub : id;
      b.title = state.errors[errLid] ? `${t('tabs.' + id)} — ${t('ui.errorHint')}` : t('tabs.' + id);
    });
    // 分頁列的 aria-label
    ['#tabs', '#bottom-nav'].forEach((sel) => {
      const el = $(sel);
      if (el) el.setAttribute('aria-label', t('ui.tabsLabel'));
    });

    // 地名標籤圖層
    if (map && labelLayer && state.theme === 'light') {
      map.removeLayer(labelLayer);
      labelLayer = L.tileLayer(lang === 'tc' ? BASEMAP.labelTc : BASEMAP.labelEn, {
        maxZoom: 19, maxNativeZoom: 19, pane: 'shadowPane', opacity: 0.95
      }).addTo(map);
    }

    // 重新渲染當前圖層（Popup 內容）
    // 注意：重建的是「圖層」而非「分頁」，水質數據分頁下要重建當前子分頁的圖層
    const lid = activeLayerId();
    if (state.loaded[lid]) {
      const prev = layers[lid];
      if (prev && map.hasLayer(prev)) map.removeLayer(prev);
      layers[lid] = null; state.loaded[lid] = false;
      activate(state.active);
    }

    renderLegend();
    updateSubTabs();
    const a2hsTxt = $('#a2hs-text');
    if (a2hsTxt) a2hsTxt.textContent = t('ui.a2hs');

    if (persist) { try { localStorage.setItem(STORAGE.lang, lang); } catch (e) {} }
  }

  /* ======================================================================
     15. 初始化
     ====================================================================== */
  function initMap() {
    map = L.map('map', {
      center: HK_CENTER,
      zoom: 11,
      minZoom: 9,
      maxZoom: 19,
      zoomControl: true,
      tap: true,
      touchZoom: true,
      scrollWheelZoom: true,
      attributionControl: true,
      preferCanvas: false
    });
    map.attributionControl.setPrefix(
      '<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a> | 資料來源：環境保護署 / DATA.GOV.HK / CSDI'
    );
  }

  function initUI() {
    $('#theme-btn').addEventListener('click', () => {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark', true);
    });
    $('#lang-btn').addEventListener('click', () => {
      applyLang(state.lang === 'tc' ? 'en' : 'tc', true);
    });
    $('#legend-head').addEventListener('click', () => {
      if (!isMobile()) return;
      legendTouched = true;
      setLegendCollapsed(!$('#legend').classList.contains('collapsed'));
    });
    $('#a2hs-close').addEventListener('click', (e) => {
      e.stopPropagation();
      $('#a2hs').classList.remove('show');
      try { localStorage.setItem('hk-env-a2hs-dismissed', '1'); } catch (err) {}
    });
    $('#a2hs').addEventListener('click', () => {
      toast(state.lang === 'tc'
        ? '請使用瀏覽器選單「加到主畫面 / 安裝應用程式」。'
        : 'Use the browser menu → "Add to Home Screen / Install app".');
    });
  }

  /* 背景預先載入其餘圖層（不阻塞首屏） */
  function prefetchRest() {
    // 由小到大排序：海水 10 筆、河溪 13 筆最快，回收點 8858 筆最後
    const rest = ['beach', 'marine', 'river', 'noise', 'cnp', 'recycle'];
    let i = 0;
    const next = () => {
      if (i >= rest.length) return;
      const id = rest[i++];
      if (!state.loaded[id] && !state.loading[id]) {
        ensureLayer(id).finally(() => setTimeout(next, 120));
      } else setTimeout(next, 120);
    };
    setTimeout(next, 800);
  }

  /* PWA：註冊 Service Worker + A2HS */
  function initPWA() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[SW] 註冊失敗：', e));
      });
    }
    let dismissed = false;
    try { dismissed = localStorage.getItem('hk-env-a2hs-dismissed') === '1'; } catch (e) {}
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      if (dismissed) return;
      $('#a2hs').classList.add('show');
    });
  }

  /* 啟動 */
  function boot() {
    // 讀取偏好
    let theme = 'light', lang = 'tc';
    try {
      theme = localStorage.getItem(STORAGE.theme) || 'light';
      lang = localStorage.getItem(STORAGE.lang) || 'tc';
    } catch (e) {}
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem(STORAGE.theme)) {
      theme = 'dark';
    }

    initMap();
    initUI();
    buildTabs();
    applyTheme(theme, false);
    applyLang(lang, false);   // 會建立底圖與標籤圖層
    renderLegend();
    syncMobileUI();
    initPWA();

    // 預設顯示「香港空氣質素監測網絡」
    state.active = null;
    activate('air');
    prefetchRest();

    // 視窗尺寸變化時重繪地圖，並同步手機版 UI
    window.addEventListener('resize', debounce(() => {
      map.invalidateSize();
      syncMobileUI();
      positionSubTabs();          // 分頁寬度／位置可能改變，子分頁列要重新對齊
    }, 150));

    /* 頂部分頁列可橫向捲動（窄視窗），捲動時子分頁列必須跟著跑，
       否則會與它所屬的分頁脫節。 */
    const tabsNav = $('#tabs');
    if (tabsNav) tabsNav.addEventListener('scroll', () => positionSubTabs(), { passive: true });

    /* 中文字型（PingFang TC / Noto Sans TC）載入後分頁寬度會變，
       屆時需再對齊一次。 */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => positionSubTabs()).catch(() => {});
    }

    /* 安全網：任何分頁按鈕的尺寸變化（轉圈、字型、瀏覽器縮放、語言切換）
       都會推移「水質數據」的水平位置，因此一律重新對齊。
       positionSubTabs() 只改 #sub-tabs 的 left/top，不會回過頭改變分頁尺寸，
       故不會造成 ResizeObserver 迴圈。 */
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => positionSubTabs());
      document.querySelectorAll('.tab').forEach((b) => ro.observe(b));
    }

    // 除錯／自動化測試用掛鉤（不影響一般使用）
    window.__hkEnvMap = {
      get state() { return state; },
      get layers() { return layers; },
      get map() { return map; },
      activate: activate,
      setWaterSub: (sub) => { if (WATER_SUBS.indexOf(sub) >= 0) { state.waterSub = sub; updateSubTabs(); } },
      activeLayerId: activeLayerId,
      positionSubTabs: positionSubTabs,
      reload: () => {
        const lid = activeLayerId();
        layers[lid] = null; state.loaded[lid] = false;
        return activate(state.active);
      }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
