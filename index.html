  /* ---- 公眾可使用的電動車充電器圖層 ---- */
  async function loadEvLayer() {
    const geo = await getLayerData('ev');
    const group = makeClusterGroup();
    const layer = L.geoJSON(geo, {
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        /* 顏色依「最快的充電速度」決定：快速 > 中速 > 標準。
           這是把官方已有的分類映射成單一顏色，不是自行評級。 */
        const conns = evConnectors(p);
        const order = ['standard', 'medium', 'quick', 'fast'];
        let speed = null;
        conns.forEach((c) => { if (order.indexOf(c[0]) > order.indexOf(speed)) speed = c[0]; });
        lyr.setIcon(pinIcon(EV_SPEED_COLOR[speed] || EV_SPEED_COLOR.standard, '🔌'));
        /* 彈窗延遲求值時一併傳入座標，實時數字由座標對照快照取得 */
        lyr.bindPopup(() => evPopup(p, lyr.getLatLng()), { maxWidth: 320, autoPan: true, autoPanPadding: [30, 60] });
        /* 實時快照按需要才抓：第一次開啟彈窗時下載（約 156KB，其後由快取提供）。
           抓完若使用者仍看着這個彈窗，就地重畫以顯示實時數字。 */
        lyr.on('popupopen', () => {
          if (evAvailIndex || evAvailPromise) return;
          const availLoaded = ensureEvAvail();
          availLoaded.then(() => {
            if (lyr.isPopupOpen && lyr.isPopupOpen()) {
              lyr.closePopup();
              lyr.openPopup();
            }
          });
        });
        // tooltip 延遲求值，避免切換語言後殘留舊語言
        lyr.bindTooltip(() => {
          const loc = evLocation(p);
          const total = evTotal(p);
          return esc([String(loc || '').trim(), total ? `${total} × 🔌` : null].filter(Boolean).join(' · '));
        }, { direction: 'top', offset: [0, -20] });
      },
      filter: (f) => f.geometry && f.geometry.type === 'Point'
    });
    layer.eachLayer((l) => group.addLayer(l));
    state.meta.ev = fmtDateTime(new Date());
    return clusterIfNeeded(group, layer.getLayers().length);
  }

  /* 環評報告生境圖（16 個圖層：多邊形 + 季節性水道線）。
     每層各自一個查詢（圖層 id 不同），並用 maxAllowableOffset 簡化幾何，
     否則 16 層原始資料約 15.3MB，實測會令瀏覽器 fetch 失敗。 */
  const HABITAT_DS = 'epd_rcd_1696985725838_7798';
  const HABITAT_GEOM_OFFSET = 0.00005;   // 約 5 米
  const HABITAT_PRECISION = 5;

  async function fetchArcLayerByUrl(url) {
    const out = [];
    let offset = 0;
    const page = DATA.habitat.pageSize || 3000;
    for (let guard = 0; guard < 40; guard++) {
      const esri = await fetchJson(url + `&resultOffset=${offset}&resultRecordCount=${page}`);
      const fc = esriToGeoJson(esri);
      out.push(...fc.features);
      const more = esri.exceededTransferLimit === true && fc.features.length >= page;
      if (!more) break;
      offset += page;
    }
    return { type: 'FeatureCollection', features: out };
  }

  function buildHabitatSubLayer(fc, layerId) {
    const isLine = layerId === 0;   // SeasonalWatercourse 是線狀
    const sub = L.geoJSON(fc, {
      style: (f) => {
        const c = habitatColor(layerId, f.properties || {});
        return isLine
          ? { color: c, weight: 2, opacity: 0.9 }
          : { color: c, weight: 1, opacity: 0.85, fillColor: c, fillOpacity: 0.45 };
      },
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        lyr.bindPopup(() => habitatPopup(p, layerId), { maxWidth: 320, autoPan: true, autoPanPadding: [30, 60] });
        lyr.bindTooltip(() => esc(habitatLabel(layerId, p)), { sticky: true });
      }
    });
    sub._habitatLayerId = layerId;   // 供圖例統計生境類別
    return sub;
  }

  /* 生境圖：漸進式載入。
     16 層合共約 8.4MB，全部並行抓再一次過繪製，使用者要對着空白地圖等很久，
     看起來像當掉。改為：
       1. 先抓最細的幾層（合共 <0.3MB），通常 1 秒內就有東西畫出來；
       2. 其餘圖層以小量並行陸續補上，每完成一層就即刻畫到地圖上。
     由於 loadHabitatLayer 會立即回傳（不等待），切換分頁不會被阻塞。 */
  const HABITAT_EAGER_COUNT = 6;   // 先載入最細的 6 層

  async function loadHabitatLayer() {
    const wrapper = L.layerGroup();
    wrapper._habitatCount = 0;
    wrapper._habitatDone = 0;
    wrapper._habitatTotal = HABITAT_LAYERS.length;
    state.meta.habitat = fmtDateTime(new Date());

    /* 由細至大排序：先畫細層，最快見到東西 */
    const ordered = HABITAT_LAYERS.slice().sort((a, b) => (a.size || 0) - (b.size || 0));
    const eager = ordered.slice(0, HABITAT_EAGER_COUNT);
    const rest = ordered.slice(HABITAT_EAGER_COUNT);

    const loadOne = async (h) => {
      try {
        const fc = await fetchArcLayerByUrl(arcLayerUrl(HABITAT_DS, h.id, {
          fields: HABITAT_FIELDS,
          offset: HABITAT_GEOM_OFFSET,
          precision: HABITAT_PRECISION
        }));
        if (!fc.features.length) return;
        wrapper.addLayer(buildHabitatSubLayer(fc, h.id));
        wrapper._habitatCount += fc.features.length;
        wrapper._habitatDone++;
        /* 每加完一層就更新圖例，令已載入的類別即時出現 */
        if (state.active === 'habitat') renderLegend();
      } catch (e) {
        console.warn(`[生境圖] 圖層 ${h.id}（${h.tc}）載入失敗：`, e);
      }
    };

    /* 背景進行，不阻塞 activate() */
    (async () => {
      await Promise.all(eager.map(loadOne));
      console.info(`[生境圖] 首批 ${eager.length} 層完成，${wrapper._habitatCount} 個要素`);
      /* 其餘以小量並行（fetchJson 內部已有主機層面的排隊與間隔） */
      await Promise.all(rest.map(loadOne));
      console.info(`[生境圖] 全部完成：${wrapper._habitatCount} 個要素（${wrapper._habitatDone}/${wrapper._habitatTotal} 層）`);
      if (state.active === 'habitat') renderLegend();
    })();

    return wrapper;
  }

  /* ---- 低噪音路面圖層（線）+ L10 影像（可選） ---- */
  async function loadNoiseLayer() {
    const geo = await getLayerData('lnrs');
    const group = makeClusterGroup();
    const layer = L.geoJSON(geo, {
      style: () => ({ color: '#8e44ad', weight: 3, opacity: 0.7 }),
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        lyr.bindPopup(() => lnrsPopup(p), { maxWidth: 300, autoPan: true, autoPanPadding: [30, 60] });
        if (p.road) lyr.bindTooltip(esc(p.road), { sticky: true });
      }
    });
    // 線狀要素不使用聚合，直接回傳圖層群組
    const wrapper = L.layerGroup([layer]);
    wrapper._vectorLayer = layer;
    state.meta.lnrs = fmtDateTime(new Date());
    return wrapper;
  }

  /* L10 2020 影像圖層（ArcGIS export 逐格抓取） */
  function buildL10Layer() {
    const L10Grid = L.GridLayer.extend({
      createTile: function (coords, done) {
        const tile = document.createElement('img');
        tile.alt = '';
        tile.setAttribute('role', 'presentation');
        const size = this.getTileSize();
        const b = this._tileCoordsToBounds(coords);
        const p1 = L.CRS.EPSG3857.project(b.getNorthWest());
        const p2 = L.CRS.EPSG3857.project(b.getSouthEast());
        const bbox = [p1.x, p2.y, p2.x, p1.y].map((v) => v.toFixed(1)).join(',');
        const url = `${DATA.l10.exportUrl}?bbox=${bbox}&bboxSR=3857&imageSR=3857` +
          `&size=${size.x},${size.y}&format=png32&transparent=true&f=image&dpi=96`;
        tile.onload = () => done(null, tile);
        tile.onerror = () => done(new Error('L10 tile'), tile);
        tile.src = url;
        return tile;
      }
    });
    return new L10Grid({
      opacity: 0.9, minZoom: 9, maxZoom: 19,
      className: 'l10-tile',
      attribution: '噪音地圖：環境保護署'
    });
  }

  function renderLegend() {
    const lid = activeLayerId();
    const def = LEGEND_DEFS[lid] ? LEGEND_DEFS[lid]() : null;

    const bodyEl = $('#legend-body');
    if (!def) { titleEl.textContent = t('legend.title'); bodyEl.innerHTML = ''; return; }
    titleEl.textContent = def.title;

    let html = '';
    def.rows.forEach((r) => {
      const sw = r.type === 'line'
        ? `<span class="legend-line" style="border-top-color:${r.color}"></span>`
        : `<span class="legend-swatch" style="background:${r.color}"></span>`;
      html += `<div class="legend-row">${sw}<span>${esc(r.label)}</span></div>`;
    });
    if (def.note) html += `<div class="legend-note">${def.note}</div>`;
    if (def.sub) {
      html += `<div class="legend-sub">` + def.sub.map((s) =>
        `<label><input type="checkbox" data-sub="${s.id}" ${s.checked ? 'checked' : ''}> ${esc(s.label)}</label>`
      ).join('') + `</div>`;

    bodyEl.innerHTML = html;

    bodyEl.querySelectorAll('input[data-sub]').forEach((cb) => {
      cb.addEventListener('change', () => toggleNoiseSub(cb.dataset.sub, cb.checked));

  function toggleNoiseSub(id, on) {
    state.noiseSub[id] = on;
    if (state.active !== 'noise') return;
    if (id === 'lnrs') {
      if (on) { if (layers.noise) map.addLayer(layers.noise); }
      else if (layers.noise) map.removeLayer(layers.noise);
    }
    if (id === 'l10') {
      if (!l10Layer) l10Layer = buildL10Layer();
      if (on) map.addLayer(l10Layer); else map.removeLayer(l10Layer);
    }
  }

  /* ======================================================================
     12. Tab 切換
     ====================================================================== */
  function buildTabs() {
    const mk = (container) => {
      container.innerHTML = TABS.map((tb) => `
        <button class="tab" type="button" role="tab" id="tab-${tb.id}"
                data-tab="${tb.id}" aria-selected="false" tabindex="-1"
                aria-controls="map" title="${esc(t('tabs.' + tb.id))}"
                aria-label="${esc(t('tabs.' + tb.id))}">
          <span class="tab-icon" aria-hidden="true">${tb.icon}</span>
          <span class="tab-label">${esc(tabShortLabel(tb))}</span>
          <span class="spinner-mini" aria-hidden="true"></span>
          <span class="err-dot" aria-hidden="true"></span>
        </button>`).join('');
    };
    mk($('#tabs'));
    mk($('#bottom-nav'));

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.addEventListener('click', () => onTabClick(btn.dataset.tab));
      btn.addEventListener('keydown', onTabKeydown);
    });
    updateSubTabs();
  }

  /* 分頁顯示文字：優先用縮寫（見 TABS.short），沒有才用完整名稱。
     完整名稱一律保留在 title／aria-label，滑鼠移過去或讀屏都拿得到。 */
  function tabShortLabel(tb) {
    if (tb.short) return tb.short[state.lang] || tb.short.en || tb.short.tc;
    return t('tabs.' + tb.id);
  }
  /* 語言切換時同步更新分頁文字與提示 */
  function refreshTabLabels() {
    TABS.forEach((tb) => {
      document.querySelectorAll(`.tab[data-tab="${tb.id}"]`).forEach((btn) => {
        const lbl = btn.querySelector('.tab-label');
        if (lbl) lbl.textContent = tabShortLabel(tb);
        btn.title = t('tabs.' + tb.id);
        btn.setAttribute('aria-label', t('tabs.' + tb.id));
      });
    });
  }

  /* 子分頁只在「水質數據」分頁出現；同時切換 body 的 has-subtabs，
     讓 CSS 決定顯示與否（桌面在主分頁之下、手機在底部導覽之上）。 */
  function updateSubTabs() {
    const nav = $('#sub-tabs');
    if (!nav) return;
    const tab = TABS.filter((x) => x.id === state.active)[0];
    const subs = tab && tab.subs;
    document.body.classList.toggle('has-subtabs', !!subs);
    nav.setAttribute('aria-label', t('ui.subTabsLabel'));
    if (!subs) { nav.innerHTML = ''; return; }

    nav.innerHTML = subs.map((sid) => {
      const on = sid === state.waterSub;
      return `<button class="sub-tab" type="button" role="tab" data-sub="${sid}"
                aria-selected="${on ? 'true' : 'false'}" tabindex="${on ? 0 : -1}"
                title="${esc(t('subs.' + sid))}">${esc(t('subs.' + sid))}</button>`;
    }).join('');

    nav.querySelectorAll('.sub-tab').forEach((b) => {
      b.addEventListener('click', () => onSubClick(b.dataset.sub));
      b.addEventListener('keydown', onSubKeydown);
    });
    positionSubTabs();
  }

  /* 把子分頁列對齊「水質數據」分頁：桌面對齊頂部分頁列、手機對齊底部導覽列，
     箭嘴擺在該分頁的水平中線上，讓使用者一眼看出子分頁隸屬於誰。
     座標取自 getBoundingClientRect()；本頁 body 為 overflow:hidden 不滾動，
     故視窗座標即絕對座標（箭嘴用 position:fixed 進一步保證一致）。 */
  function positionSubTabs() {
    const nav = $('#sub-tabs');
    if (!nav || !document.body.classList.contains('has-subtabs')) return;

    const mobile = window.matchMedia('(max-width: 767px)').matches;
    // 取「實際可見」的那一組分頁按鈕（手機＝底部導覽、桌面＝頂部分頁列）
    const anchor = document.querySelector(
      mobile ? '#bottom-nav .tab[data-tab="water"]' : '#tabs .tab[data-tab="water"]');
    if (!anchor || !anchor.getClientRects().length) return;

    const a = anchor.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const w = nav.offsetWidth;
    // 左緣對齊分頁左緣，再往內夾住，確保整列不超出視窗
    const left = Math.round(Math.max(8, Math.min(a.left, vw - w - 8)));
    nav.style.left = left + 'px';
    nav.style.right = 'auto';

    const caret = $('#sub-caret');
    if (!caret) return;
    const pr = nav.getBoundingClientRect();
    const cx = a.left + a.width / 2;
    // 箭嘴以分頁中心為準，但不可越出子分頁列本身
    caret.style.left = Math.round(Math.max(left + 14, Math.min(cx, left + w - 14))) + 'px';
    /* 12×12 方塊轉 45°（或 225°）後，尖端比版面框再外伸約 2.5px；
       這兩個數值讓尖端剛好觸及頂部分頁列的底邊／底部導覽的頂邊。 */
    caret.style.top = (mobile ? pr.bottom - 4.5 : pr.top - 4.5) + 'px';
    caret.style.transform = `translateX(-50%) rotate(${mobile ? 225 : 45}deg)`;
  }

  const onSubClick = debounce(function (sub) {
    if (!sub) return;
    recenterMap();
    if (sub === state.waterSub) return;
    state.waterSub = sub;
    updateSubTabs();
    activate(state.active);
  }, DEBOUNCE_MS);

  function onSubKeydown(e) {
    const keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    const list = (TABS.filter((x) => x.id === state.active)[0] || {}).subs || [];
    if (!list.length) return;
    let i = list.indexOf(state.waterSub);
    if (e.key === 'ArrowRight') i = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft') i = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = list.length - 1;
    const target = document.querySelector(`.sub-tab[data-sub="${list[i]}"]`);
    if (target) { target.focus(); onSubClick(list[i]); }
  }

  function onTabKeydown(e) {
    const keys = ['ArrowRight', 'ArrowLeft', 'Home', 'End'];
    if (keys.indexOf(e.key) < 0) return;
    e.preventDefault();
    const list = TABS.map((x) => x.id);
    let i = list.indexOf(state.active);
    if (e.key === 'ArrowRight') i = (i + 1) % list.length;
    else if (e.key === 'ArrowLeft') i = (i - 1 + list.length) % list.length;
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = list.length - 1;
    const target = document.querySelector(`.tab[data-tab="${list[i]}"]`);
    if (target) { target.focus(); onTabClick(list[i]); }
  }

  function setTabState(id) {
    document.querySelectorAll('.tab').forEach((b) => {
      const on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.tabIndex = on ? 0 : -1;
    });
  }

  /* 載入中／錯誤指示掛在「分頁」上，但 ensureLayer 傳入的是「圖層」id，
     所以水質數據的三個子圖層都要映射回 water 分頁。 */
  function setTabLoading(layerId, on) {
    const tabId = tabOfLayer(layerId);
    document.querySelectorAll(`.tab[data-tab="${tabId}"]`).forEach((b) => b.classList.toggle('is-loading', !!on));
    /* 轉圈圖示（12px + 6px 間距）會把分頁撐寬 18px，連帶推移右邊的分頁。
       若「水質數據」左邊的分頁正在載入，子分頁列就會偏掉，故立即重新對齊。 */
    positionSubTabs();
  }
  function setTabError(layerId, on) {
    const tabId = tabOfLayer(layerId);
    document.querySelectorAll(`.tab[data-tab="${tabId}"]`).forEach((b) => {
      b.classList.toggle('has-error', !!on);
      if (on) b.title = `${t('tabs.' + tabId)} — ${t('ui.errorHint')}`;
      else b.title = t('tabs.' + tabId);
    });
  }

  function showLoading(on, text) {
    const el = $('#loading');
    if (on) { $('#loading-text').textContent = text || t('ui.loading'); el.classList.add('show'); }
    else el.classList.remove('show');
  }

  /* 移除地圖上所有已存在圖層 */
  function clearMapLayers() {
    Object.keys(layers).forEach((k) => {
      if (layers[k] && map.hasLayer(layers[k])) map.removeLayer(layers[k]);
    });
    if (l10Layer && map.hasLayer(l10Layer)) map.removeLayer(l10Layer);
  }

  /* 確保圖層已載入（失敗時記錄錯誤並回傳 null） */
  async function ensureLayer(id) {
    if (state.loaded[id]) return layers[id];
    if (state.loading[id]) return state.loading[id];
    const task = (async () => {
      setTabLoading(id, true);
      try {
        let lyr;
        if (id === 'air') lyr = await loadAirLayer();
        else if (id === 'beach') lyr = await loadBeachLayer();
        else if (id === 'marine') lyr = await loadMarineLayer();
        else if (id === 'river') lyr = await loadRiverLayer();
        else if (id === 'recycle') lyr = await loadRecycleLayer();
        else if (id === 'ev') lyr = await loadEvLayer();
        else if (id === 'habitat') lyr = await loadHabitatLayer();
        else if (id === 'noise') lyr = await loadNoiseLayer();
        else if (id === 'cnp') lyr = await loadCnpLayer();
        layers[id] = lyr;
        state.loaded[id] = true;
        state.errors[id] = false;
        setTabError(id, false);
        return lyr;
      } catch (e) {
        state.errors[id] = true;
        setTabError(id, true);
        // 錯誤訊息用資料集名稱（tabs.<layerId> 對子圖層並不存在）
        const nm = DATA[id] ? t('datasetNames.' + DATA[id].datasetKey) : t('tabs.' + tabOfLayer(id));
        console.error(`[圖層錯誤] ${nm}：`, e);
        toast(t('ui.errorLayer').replace('{name}', nm));
        return null;
      } finally {
        setTabLoading(id, false);
        state.loading[id] = null;
      }
    })();
    state.loading[id] = task;
    return task;
  }

  const isMobile = () => window.matchMedia('(max-width: 767px)').matches;

  /* 手機版：圖例預設折疊（桌面版一律展開） */
  function setLegendCollapsed(collapsed) {
    const el = $('#legend');
    const btn = $('#legend-toggle');
    el.classList.toggle('collapsed', !!collapsed);
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    btn.textContent = collapsed ? '▸' : '▾';
  }

  /* 依視口寬度同步手機版 UI（首次載入與尺寸變化時呼叫） */
  function syncMobileUI() {
    if (isMobile()) {
      if (!legendTouched) setLegendCollapsed(true);
    } else {
      setLegendCollapsed(false);
    }
  }

  async function activate(id) {
    state.active = id;
    setTabState(id);
    updateSubTabs();
    clearMapLayers();

    /* 分頁只決定「顯示哪一組」，實際要載入的圖層由 activeLayerId() 決定 */
    const lid = activeLayerId();
    /* 注意：並非每個圖層 id 都在 DATA 有對應項目 ——「低噪音路面」分頁的 id 是
       noise，但資料設定是 DATA.lnrs（noise 分頁另有 lnrs/l10 兩個子圖層開關）。
       因此這裡必須容錯取名稱，否則在 noise 分頁切換語言時會拋
       TypeError: Cannot read properties of undefined (reading 'datasetKey')，
       令 applyLang() 中斷（圖例與地名圖層都不會更新）。 */
    if (!state.loaded[lid]) {
      const nameKey = DATA[lid]
        ? 'datasetNames.' + DATA[lid].datasetKey
        : 'tabs.' + tabOfLayer(lid);
      showLoading(true, t('ui.loadingLayer').replace('{name}', t(nameKey)));
    }
    const lyr = await ensureLayer(lid);
    showLoading(false);

    if (lyr) {
      map.addLayer(lyr);
      activeLayer = lyr;
      if (lid === 'noise') {
        if (state.noiseSub.l10) {
          if (!l10Layer) l10Layer = buildL10Layer();
          map.addLayer(l10Layer);
        }
        if (!state.noiseSub.lnrs && layers.noise) map.removeLayer(layers.noise);
      }
    }
    renderLegend();
    if (isMobile() && !legendTouched) setLegendCollapsed(true);
  }

  /* 使用者要求：每次點頂部分頁（或手機底部導覽）時，地圖一律自動回到香港中心，
     以免停留在上一個圖層的偏遠位置而看不到新圖層。連點同一分頁亦會歸位。 */
  function recenterMap() {
    if (map) map.setView(HK_CENTER, MAP_DEFAULT_ZOOM, { animate: true });
  }
  const onTabClick = debounce(function (id) {
    if (!id) return;
    recenterMap();
    if (id === state.active) return;
    activate(id);
  }, DEBOUNCE_MS);

  /* ======================================================================
     13. 主題切換
     ====================================================================== */
  function applyTheme(theme, persist) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    const meta = $('#meta-theme-color');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#1a1a2e' : '#ffffff');
    const btn = $('#theme-btn');
    btn.textContent = theme === 'dark' ? '☀️' : '🌙';
    btn.setAttribute('aria-label', theme === 'dark' ? t('ui.themeLight') : t('ui.themeDark'));
    btn.title = btn.getAttribute('aria-label');

    // 底圖替換
    if (map) {
      if (basemapLayer) { map.removeLayer(basemapLayer); basemapLayer = null; }
      if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }

      if (theme === 'dark') {
        basemapLayer = L.layerGroup([
          L.tileLayer(BASEMAP.darkBase, { maxZoom: 19, attribution: DARK_ATTR }),
          L.tileLayer(BASEMAP.darkRef, { maxZoom: 19 })
        ]).addTo(map);
        // Esri 深色底圖本身已含地名，無需另加政府地名圖層
      } else {
        basemapLayer = L.tileLayer(BASEMAP.light, {
          maxZoom: 19, maxNativeZoom: 19, attribution: GOV_ATTR
        }).addTo(map);
        labelLayer = L.tileLayer(state.lang === 'tc' ? BASEMAP.labelTc : BASEMAP.labelEn, {
          maxZoom: 19, maxNativeZoom: 19, pane: 'shadowPane', opacity: 0.95
        }).addTo(map);
      }
      if (basemapLayer.bringToBack) basemapLayer.bringToBack();
      else if (basemapLayer.eachLayer) basemapLayer.eachLayer((l) => l.bringToBack && l.bringToBack());
    }
    if (persist) { try { localStorage.setItem(STORAGE.theme, theme); } catch (e) {} }
  }

  /* ======================================================================
     13b. 字體大小（無障礙：長者友善）
     ====================================================================== */
  /* 以 --fs 倍率縮放全站文字（所有文字 font-size 都是 calc(…px * var(--fs))）。
     索引 0 就是原本大小，即最小；只可往上加。到頂／到底時停用按鈕，
     讓使用者一眼看出還有沒有得加，而不是以為按鈕壞了。 */
  function applyFontScale(idx, persist) {
    const n = Number(idx);
    const i = Math.max(0, Math.min(FS_STEPS.length - 1, isNaN(n) ? 0 : n));
    state.fs = i;
    document.documentElement.style.setProperty('--fs', String(FS_STEPS[i]));

    const down = $('#fs-down'), up = $('#fs-up'), group = $('#fs-group');
    if (down) down.disabled = (i === 0);
    if (up) up.disabled = (i === FS_STEPS.length - 1);
    if (group) group.setAttribute('aria-label', t('ui.fsGroup'));
    if (down) { down.setAttribute('aria-label', t('ui.fsDecrease')); down.title = t('ui.fsDecrease'); }
    if (up) { up.setAttribute('aria-label', t('ui.fsIncrease')); up.title = t('ui.fsIncrease'); }

    if (persist) { try { localStorage.setItem(STORAGE.fs, String(i)); } catch (e) {} }
  }
  function stepFontScale(delta) { applyFontScale(state.fs + delta, true); }

  /* ======================================================================
     14. 語言切換
     ====================================================================== */
  function applyLang(lang, persist) {
    state.lang = lang;
    document.documentElement.setAttribute('lang', lang === 'tc' ? 'zh-Hant' : 'en');
    document.title = t('title');

    // 標題與按鈕
    $('#app-title').textContent = t('title');
    const langBtn = $('#lang-btn');
    langBtn.textContent = lang === 'tc' ? '中 / EN' : 'EN / 中';
    langBtn.setAttribute('aria-label', t('ui.langSwitch'));

    // Tab 文字
    document.querySelectorAll('.tab').forEach((b) => {
      const id = b.dataset.tab;
      const lbl = b.querySelector('.tab-label');
      if (lbl) lbl.textContent = t('tabs.' + id);
      // 錯誤狀態以「圖層」為鍵；水質數據分頁看當前子分頁
      const errLid = id === 'water' ? state.waterSub : id;
      b.title = state.errors[errLid] ? `${t('tabs.' + id)} — ${t('ui.errorHint')}` : t('tabs.' + id);
    });
    // 分頁列的 aria-label
    ['#tabs', '#bottom-nav'].forEach((sel) => {
      const el = $(sel);
      if (el) el.setAttribute('aria-label', t('ui.tabsLabel'));
    });

    // 地名標籤圖層
    if (map && labelLayer && state.theme === 'light') {
      map.removeLayer(labelLayer);
      labelLayer = L.tileLayer(lang === 'tc' ? BASEMAP.labelTc : BASEMAP.labelEn, {
        maxZoom: 19, maxNativeZoom: 19, pane: 'shadowPane', opacity: 0.95
      }).addTo(map);
    }

    // 重新渲染當前圖層（Popup 內容）
    // 注意：重建的是「圖層」而非「分頁」，水質數據分頁下要重建當前子分頁的圖層
    const lid = activeLayerId();
    if (state.loaded[lid]) {
      const prev = layers[lid];
      if (prev && map.hasLayer(prev)) map.removeLayer(prev);
      layers[lid] = null; state.loaded[lid] = false;
      activate(state.active);
    }

    renderLegend();
    updateSubTabs();
    refreshTabLabels();
    const a2hsTxt = $('#a2hs-text');
    if (a2hsTxt) a2hsTxt.textContent = t('ui.a2hs');

    /* 字體大小按鈕的標籤／title 也要跟著語言走 */
    applyFontScale(state.fs, false);

    if (persist) { try { localStorage.setItem(STORAGE.lang, lang); } catch (e) {} }
  }

  /* ======================================================================
     15. 初始化
     ====================================================================== */
  function initMap() {
    map = L.map('map', {
      center: HK_CENTER,
      zoom: MAP_DEFAULT_ZOOM,
      minZoom: 9,
      maxZoom: 19,
      zoomControl: true,
      tap: true,
      touchZoom: true,
      scrollWheelZoom: true,
      attributionControl: true,
      preferCanvas: false
    });
    map.attributionControl.setPrefix(
      '<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a> | 資料來源：環境保護署 / DATA.GOV.HK / CSDI'
    );
  }

  function initUI() {
    $('#theme-btn').addEventListener('click', () => {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark', true);
    });
    $('#lang-btn').addEventListener('click', () => {
      applyLang(state.lang === 'tc' ? 'en' : 'tc', true);
    });
    $('#fs-down').addEventListener('click', () => stepFontScale(-1));
    $('#fs-up').addEventListener('click', () => stepFontScale(1));
    $('#legend-head').addEventListener('click', () => {
      if (!isMobile()) return;
      legendTouched = true;
      setLegendCollapsed(!$('#legend').classList.contains('collapsed'));
    });
    $('#a2hs-close').addEventListener('click', (e) => {
      e.stopPropagation();
      $('#a2hs').classList.remove('show');
      try { localStorage.setItem('hk-env-a2hs-dismissed', '1'); } catch (err) {}
    });
    $('#a2hs').addEventListener('click', () => {
      toast(state.lang === 'tc'
        ? '請使用瀏覽器選單「加到主畫面 / 安裝應用程式」。'
        : 'Use the browser menu → "Add to Home Screen / Install app".');
    });
    /* 彈窗互動：泳灘檢視切換（泳灘分頁是真正的 <button>，鍵盤操作原生支援） */
    const mapEl = $('#map');
    if (mapEl) {
      mapEl.addEventListener('click', onMapPopupClick);
    }
  }

  /* 背景預先載入（只挑「細而快」的圖層）
     原本會把「其餘全部」圖層逐個預先載入，但實測代價很大：
       - 回收點 8,858 筆：每頁 987KB，共 3 頁（約 2.9MB，每頁約 1.85 秒）
       - 電動車充電器 988 筆：781KB
       - 建築噪音許可證 1,962 筆：317KB
     全部加起來每次開啟頁面都會在背景拉約 3.8MB。雖然不阻塞首屏，
     但會與使用者真正要看的圖層爭用同一條（已被主機限速的）連線，
     而且只要還有背景請求，載入指示器就會一直轉，看起來像「當掉」。
     現在只預先載入細而快的圖層（合共約 6KB），其餘一律等到使用者
     真的切到那個分頁才載入 —— 切換時才顯示載入指示器，語意也較正確。 */
  const PREFETCH_IDS = ['beach', 'marine', 'river'];
  const PREFETCH_DELAY_MS = 2500;
  const PREFETCH_GAP_MS = 200;

  function prefetchRest() {
    // 只在使用者閒置時才做，避免與首屏競爭
    const start = () => {
      let i = 0;
      const next = () => {
        if (i >= PREFETCH_IDS.length) return;
        const id = PREFETCH_IDS[i++];
        if (!state.loaded[id] && !state.loading[id]) {
          ensureLayer(id).finally(() => setTimeout(next, PREFETCH_GAP_MS));
        } else setTimeout(next, PREFETCH_GAP_MS);
      };
      next();
    };
    if (window.requestIdleCallback) {
      window.requestIdleCallback(start, { timeout: PREFETCH_DELAY_MS });
    } else {
      setTimeout(start, PREFETCH_DELAY_MS);
    }
  }

  /* PWA：註冊 Service Worker + A2HS */
  function initPWA() {
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('[SW] 註冊失敗：', e));
      });
    }
    let dismissed = false;
    try { dismissed = localStorage.getItem('hk-env-a2hs-dismissed') === '1'; } catch (e) {}
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      if (dismissed) return;
      $('#a2hs').classList.add('show');
    });
  }

  /* 啟動 */
  function boot() {
    // 讀取偏好
    let theme = 'light', lang = 'tc', fsIdx = 0;
    try {
      theme = localStorage.getItem(STORAGE.theme) || 'light';
      lang = localStorage.getItem(STORAGE.lang) || 'tc';
      fsIdx = Number(localStorage.getItem(STORAGE.fs));
    } catch (e) {}
    if (isNaN(fsIdx)) fsIdx = 0;      // 未儲存過（null → 0）或值壞掉都回到最小
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches && !localStorage.getItem(STORAGE.theme)) {
      theme = 'dark';
    }

    initMap();
    initUI();
    buildTabs();
    applyTheme(theme, false);
    applyLang(lang, false);   // 會建立底圖與標籤圖層
    applyFontScale(fsIdx, false);   // 套用已儲存的字體大小
    renderLegend();
    syncMobileUI();
    initPWA();

    // 預設顯示「香港空氣質素監測網絡」
    state.active = null;
    activate('air');
    prefetchRest();

    // 視窗尺寸變化時重繪地圖，並同步手機版 UI
    window.addEventListener('resize', debounce(() => {
      map.invalidateSize();
      syncMobileUI();
      positionSubTabs();          // 分頁寬度／位置可能改變，子分頁列要重新對齊
    }, 150));

    /* 頂部分頁列可橫向捲動（窄視窗），捲動時子分頁列必須跟著跑，
       否則會與它所屬的分頁脫節。 */
    const tabsNav = $('#tabs');
    if (tabsNav) tabsNav.addEventListener('scroll', () => positionSubTabs(), { passive: true });

    /* 中文字型（PingFang TC / Noto Sans TC）載入後分頁寬度會變，
       屆時需再對齊一次。 */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => positionSubTabs()).catch(() => {});
    }

    /* 安全網：任何分頁按鈕的尺寸變化（轉圈、字型、瀏覽器縮放、語言切換）
       都會推移「水質數據」的水平位置，因此一律重新對齊。
       positionSubTabs() 只改 #sub-tabs 的 left/top，不會回過頭改變分頁尺寸，
       故不會造成 ResizeObserver 迴圈。 */
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => positionSubTabs());
      document.querySelectorAll('.tab').forEach((b) => ro.observe(b));
    }

    // 除錯／自動化測試用掛鉤（不影響一般使用）
    window.__hkEnvMap = {
      get state() { return state; },
      get layers() { return layers; },
      get map() { return map; },
      activate: activate,
      setWaterSub: (sub) => { if (WATER_SUBS.indexOf(sub) >= 0) { state.waterSub = sub; updateSubTabs(); } },
      activeLayerId: activeLayerId,
      positionSubTabs: positionSubTabs,
      /* 除錯／測試用：檢查歷史檢視的狀態 */
      beachDebug: () => ({
        historyCacheKeys: Object.keys(beachHistoryCache).length,
        cachedStatuses: Object.keys(beachHistoryCache).map((k) => beachHistoryCache[k].status),
        viewKeys: Object.keys(beachHistoryView).map((k) => k + '=' + beachHistoryView[k])
      }),
      reload: () => {
        const lid = activeLayerId();
        layers[lid] = null; state.loaded[lid] = false;
        return activate(state.active);
      }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
