<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="香港環保數據地圖 — 空氣質素、泳灘水質、回收點及低噪音路面空間數據">
<title>香港環保數據地圖</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" id="meta-theme-color">
<link rel="icon" href="icons/icon-192.png">

<!-- Leaflet + MarkerCluster (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
/* ============================================================
   主題：CSS 自訂屬性（深色 / 淺色）
   ============================================================ */
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f5f5f5;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --border-color: #e0e0e0;
  --tab-active: #0066cc;
  --popup-bg: #ffffff;
  --popup-text: #1a1a1a;
  --shadow: 0 2px 10px rgba(0,0,0,.12);
  --shadow-strong: 0 6px 24px rgba(0,0,0,.18);
  --header-h: 60px;
  --bottomnav-h: 0px;
  --subtab-h: 42px;
  /* 字體縮放倍率（1 = 最小，即原本大小）。所有文字 font-size 都乘上這個值，
     由右上角的 A−／A+ 控制（見 applyFontScale）。圖示（18/19/22/26px）不縮放，
     以免撐爆固定高度的按鈕。 */
  --fs: 1;
}
[data-theme="dark"] {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --text-primary: #eaeaea;
  --text-secondary: #a0a0a0;
  --border-color: #2a2a4a;
  --tab-active: #4da6ff;
  --popup-bg: #1e1e3a;
  --popup-text: #eaeaea;
  --shadow: 0 2px 10px rgba(0,0,0,.5);
  --shadow-strong: 0 6px 24px rgba(0,0,0,.6);
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  height: 100%;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s ease, color .25s ease;
}
body { overflow: hidden; }

/* ============================================================
   頂部導航欄
   ============================================================ */
.topbar {
  position: relative; z-index: 1200;
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: var(--bg-primary);
  border-bottom: 1px solid var(--border-color);
}
.brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.brand-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: linear-gradient(135deg, #16a34a, #4da6ff);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--tab-active) 18%, transparent);
}
.brand h1 {
  font-size: calc(15px * var(--fs)); font-weight: 700; margin: 0; white-space: nowrap;
  letter-spacing: .2px;
}

.tabs {
  display: flex; align-items: stretch; gap: 4px;
  flex: 1 1 auto; overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 12px;
  border: 0; background: transparent; cursor: pointer;
  color: var(--text-secondary); font-size: calc(13px * var(--fs)); font-weight: 600;
  font-family: inherit; white-space: nowrap;
  border-radius: 8px 8px 0 0;
  border-bottom: 3px solid transparent;
  transition: color .18s, background-color .18s, border-color .18s;
}
.tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
.tab[aria-selected="true"] {
  color: var(--tab-active);
  border-bottom-color: var(--tab-active);
  background: color-mix(in srgb, var(--tab-active) 8%, transparent);
}
.tab:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }
.tab .tab-icon { font-size: calc(15px * var(--fs)); line-height: 1; }
.tab .err-dot {
  position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 50%;
  background: #e74c3c; box-shadow: 0 0 0 2px var(--bg-primary);
  display: none;
}
.tab.has-error .err-dot { display: block; }
.tab .spinner-mini {
  width: 12px; height: 12px; flex: 0 0 auto;
  border: 2px solid color-mix(in srgb, var(--tab-active) 30%, transparent);
  border-top-color: var(--tab-active);
  border-radius: 50%; animation: spin .8s linear infinite;
  display: none;
}
.tab.is-loading .spinner-mini { display: inline-block; }

/* ============================================================
   子分頁（僅「水質數據」分頁顯示）
   桌面版浮在主分頁列之下；手機版浮在底部導覽列之上（見 media query）。
   只在 body.has-subtabs 時出現，其餘分頁完全不佔位。
   left 由 positionSubTabs() 依「水質數據」分頁的位置設定，此處為後備值。
   ============================================================ */
.sub-tabs {
  position: absolute; z-index: 1150;
  top: calc(var(--header-h) + 7px); left: 12px;
  display: none; align-items: center; gap: 4px;
  height: var(--subtab-h); padding: 4px;
  max-width: calc(100vw - 24px);
  overflow-x: auto; scrollbar-width: none;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); border-radius: 999px;
  box-shadow: var(--shadow);
}
.sub-tabs::-webkit-scrollbar { display: none; }
body.has-subtabs .sub-tabs { display: flex; }

/* 箭嘴：指向子分頁所屬的分頁（桌面指向上方「水質數據」、手機指向下方底部導覽）。
   刻意做成 #sub-tabs 的「兄弟節點」而非子元素 —— .sub-tabs 有 overflow-x: auto，
   子元素會被裁掉；兄弟節點才能露出箭嘴。z-index 較低，下半部藏在膠囊後面。
   位置與旋轉由 positionSubTabs() 設定。 */
.sub-caret {
  position: fixed; z-index: 1149;
  display: none; width: 12px; height: 12px;
  background: var(--popup-bg);
  border-left: 1px solid var(--border-color);
  border-top: 1px solid var(--border-color);
  border-radius: 2px 0 0 0;
  pointer-events: none;
}
body.has-subtabs .sub-caret { display: block; }
.sub-tab {
  flex: 0 0 auto;
  display: inline-flex; align-items: center;
  height: 100%; padding: 0 13px;
  border: 0; border-radius: 999px; background: transparent;
  color: var(--text-secondary); font-family: inherit;
  font-size: calc(12.5px * var(--fs)); font-weight: 600; white-space: nowrap; cursor: pointer;
  transition: color .18s, background-color .18s;
}
.sub-tab:hover { color: var(--text-primary); background: var(--bg-secondary); }
.sub-tab[aria-selected="true"] { color: #fff; background: var(--tab-active); }
.sub-tab:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }

.actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
.icon-btn {
  min-width: 44px; min-height: 44px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid var(--border-color); border-radius: 10px;
  background: var(--bg-secondary); color: var(--text-primary);
  cursor: pointer; font-size: calc(15px * var(--fs)); font-family: inherit; font-weight: 600;
  transition: background-color .18s, border-color .18s, transform .12s;
}
.icon-btn:hover { border-color: var(--tab-active); color: var(--tab-active); }
.icon-btn:active { transform: scale(.96); }
.icon-btn:focus-visible { outline: 2px solid var(--tab-active); outline-offset: 2px; }
#lang-btn { font-size: calc(12px * var(--fs)); letter-spacing: .3px; }

/* 字體大小控制（A− / A+）。兩顆併成一段，一看便知是一組；
   最小為目前大小（--fs: 1），只能放大。 */
.fs-group { display: inline-flex; align-items: stretch; }
.fs-group .fs-btn {
  min-width: 40px; padding: 0 6px; border-radius: 0; letter-spacing: 0;
}
.fs-group .fs-btn:first-child { border-radius: 10px 0 0 10px; }
.fs-group .fs-btn:last-child { border-radius: 0 10px 10px 0; margin-left: -1px; }
.fs-group .fs-btn:focus-visible { z-index: 1; }
.fs-group .fs-btn:disabled { opacity: .38; cursor: default; }
.fs-group .fs-btn:disabled:hover {
  border-color: var(--border-color); color: var(--text-primary);
}
.fs-group .fs-btn:disabled:active { transform: none; }

/* ============================================================
   地圖
   ============================================================ */
#map {
  position: absolute; inset: var(--header-h) 0 0 0;
  background: var(--bg-secondary);
  z-index: 1;
}
.leaflet-container { background: var(--bg-secondary); font-family: inherit; }
.leaflet-container a { color: var(--tab-active); }

/* ============================================================
   圖例
   ============================================================ */
.legend {
  position: absolute; right: 12px; bottom: 24px; z-index: 900;
  max-width: 250px;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); border-radius: 10px;
  box-shadow: var(--shadow);
  font-size: calc(12px * var(--fs)); overflow: hidden;
}
.legend-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; font-weight: 700; font-size: calc(12.5px * var(--fs));
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  cursor: default;
}
.legend-toggle {
  display: none; border: 0; background: transparent; cursor: pointer;
  color: var(--text-secondary); font-size: calc(13px * var(--fs)); font-family: inherit;
  min-width: 28px; min-height: 28px;
}
.legend-body { padding: 9px 12px 11px; }
.legend-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; line-height: 1.35; }
.legend-swatch {
  width: 13px; height: 13px; border-radius: 50%; flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,.18);
}
.legend-line { width: 18px; height: 0; border-top: 3px solid #8e44ad; border-radius: 2px; flex: 0 0 auto; }
.legend-note {
  margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border-color);
  color: var(--text-secondary); font-size: calc(10.5px * var(--fs)); line-height: 1.45;
}
.legend-sub { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border-color); }
.legend-sub label {
  display: flex; align-items: center; gap: 7px; margin: 5px 0;
  cursor: pointer; font-size: calc(11.5px * var(--fs)); color: var(--text-primary);
}
.legend-sub input { accent-color: var(--tab-active); width: 15px; height: 15px; }

/* ============================================================
   Popup（統一 .custom-popup）
   ============================================================ */
.leaflet-popup-content-wrapper {
  background: var(--popup-bg); color: var(--popup-text);
  border-radius: 8px; box-shadow: var(--shadow-strong);
  border: 1px solid var(--border-color);
}
.leaflet-popup-tip { background: var(--popup-bg); border: 1px solid var(--border-color); }
.leaflet-popup-content { margin: 0; }
/* 關閉按鈕：原本只是一個光禿禿的 ×，壓在說明文字（.cp-desc）上時幾乎看不見。
   改成有底襯的圓形按鈕、往內縮一點，並用 flex 置中（原本靠 padding-top 手推）。
   .cp-desc 與 .cp-title 都保留右側內距，文字不會跑到按鈕底下。 */
.leaflet-container a.leaflet-popup-close-button {
  color: var(--text-secondary); font-size: 20px; width: 28px; height: 28px;
  line-height: 1; z-index: 3; text-decoration: none;
  top: 6px; right: 6px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 50%; box-shadow: var(--shadow);
}
.leaflet-container a.leaflet-popup-close-button:hover {
  color: var(--text-primary); border-color: var(--text-primary);
}

.custom-popup { max-width: 280px; width: 280px; font-size: calc(13px * var(--fs)); color: var(--popup-text); }
.custom-popup .cp-title {
  font-size: calc(16px * var(--fs)); font-weight: 700; line-height: 1.35;
  padding: 12px 40px 8px 13px; margin: 0;
  border-bottom: 1px solid var(--border-color);
}
/* 歷史記錄卡很高（海水實測內容 651px），整個彈窗超出畫面。限制內容區高度、內部
   捲動即可；標題在捲動區之外，不會被一起捲走。320px 約為最高那張卡的一半
   （651 → 320）；較矮的卡（例如最新數據 288px）不受影響，不會出現多餘捲軸。 */
.custom-popup .cp-body {
  padding: 10px 13px 12px;
  max-height: min(320px, 46vh); overflow-y: auto; overscroll-behavior: contain;
}
/* 標籤／內容列。標籤原本是 flex: 0 0 auto（永不收縮），遇到長標籤（例如英文的
   "Type of Air Quality Monitoring Station"）就會撐爆卡片：實測在最大字體下標籤
   寬 341px、卡片只有 260px，內容被壓成每行一個字並溢出卡外 102px。
   改為：整列可換行；標籤最寬只到卡片全寬（超出時在卡內換行）；
   內容有最小基準寬度（6em，隨字體縮放）—— 兩者放不下時內容自動落到下一行，
   等同上下堆疊，因此任何語言、任何字體大小都不會溢出。 */
.custom-popup .cp-row {
  display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 6px 0; line-height: 1.45;
}
.custom-popup .cp-label {
  flex: 0 0 auto; min-width: 84px; max-width: 100%;
  color: var(--text-secondary); font-size: calc(12px * var(--fs));
  overflow-wrap: anywhere;
}
.custom-popup .cp-value {
  flex: 1 1 6em; min-width: 0; overflow-wrap: anywhere; word-break: break-word;
}
/* 寬內容列：標籤在上、內容在下。用於「充電器（速度 · 插頭標準 · 數目）」這類
   內容比標籤長得多的情況 —— 原本單行 flex 會令徽章擠在右邊並超出卡片。 */
.custom-popup .cp-row.cp-row--stack { display: block; }
.custom-popup .cp-row.cp-row--stack .cp-label { display: block; min-width: 0; margin-bottom: 4px; }
.custom-popup .cp-row.cp-row--stack .cp-value { display: block; }
/* 每個徽章獨立一行，確保多個「速度 · 插頭標準 · 數目」不會互相擠壓 */
.custom-popup .cp-chargers { display: block; }
.custom-popup .cp-chargers .badge { display: inline-block; margin: 0 0 4px; }
.custom-popup .cp-address { color: var(--text-secondary); font-size: calc(12px * var(--fs)); }
/* 許可證編號：等寬字體，方便對照 */
.custom-popup .cp-permit-no {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 700; font-size: calc(12.5px * var(--fs)); letter-spacing: .02em;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 4px; padding: 1px 6px;
}
/* 彈窗內的檢視切換（水質等級 / 歷史記錄） */
.custom-popup .cp-tabs { display: flex; gap: 6px; }
.custom-popup .cp-tab {
  font: inherit; font-size: calc(12px * var(--fs)); font-weight: 600; cursor: pointer;
  padding: 4px 12px; border-radius: 999px;
  border: 1px solid var(--border-color);
  background: var(--bg-secondary); color: var(--text-secondary);
}
.custom-popup .cp-tab.is-on {
  background: var(--tab-active); border-color: var(--tab-active); color: #fff;
}
/* 歷史泳灘水質數列圖 */
.custom-popup .hb-chart { display: block; }
.custom-popup .hb-chart svg { display: block; background: var(--bg-secondary); border-radius: 4px; }
/* 整條數列都沒有值（例如該河溪測站不公佈生化需氧量） */
.custom-popup .hb-chart-empty {
  padding: 12px 8px; background: var(--bg-secondary); border-radius: 4px; text-align: center;
}
/* 圖表可按一下放大（見 openChartModal） */
.custom-popup .hb-chart[data-chart-title] { cursor: zoom-in; }
.custom-popup .hb-chart[data-chart-title]:hover svg { outline: 1px solid var(--tab-active); }

/* 放大後的圖表彈窗（點擊彈窗內任一張圖表開啟；Esc／點背景／按 × 關閉） */
.chart-modal {
  position: fixed; inset: 0; z-index: 3000;
  display: flex; align-items: center; justify-content: center;
}
.chart-modal[hidden] { display: none; }
.chart-modal__backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); }
.chart-modal__box {
  position: relative; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  background: var(--popup-bg); color: var(--popup-text); border: 1px solid var(--border-color);
  border-radius: 8px; box-shadow: var(--shadow-strong);
  display: flex; flex-direction: column;
}
.chart-modal__head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-bottom: 1px solid var(--border-color);
}
.chart-modal__title { margin: 0; font-size: calc(14px * var(--fs)); font-weight: 700; }
.chart-modal__close {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
  background: var(--bg-secondary); color: var(--text-secondary);
  border: 1px solid var(--border-color); font-size: 20px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.chart-modal__close:hover { color: var(--text-primary); border-color: var(--text-primary); }
.chart-modal__body { padding: 12px; overflow: auto; }
.chart-modal__body svg { width: 100%; height: auto; background: var(--bg-secondary); border-radius: 4px; }
/* 日期原本畫在 .hb-axis 軸列，現已移進圖表 SVG（與海水／河溪版面一致），故移除 */
.custom-popup .cp-sub { color: var(--text-secondary); font-size: calc(11.5px * var(--fs)); margin-top: 2px; }

/* 彩色標籤：關鍵數值 */
.badge {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  font-weight: 700; font-size: calc(12.5px * var(--fs)); color: #fff; line-height: 1.5;
  /* 原本是 white-space: nowrap，長標籤（例如 "General Construction Works"）在放大
     字體後會比卡片還寬並溢出卡外。改為可換行並限制在卡片寬度內。 */
  max-width: 100%; white-space: normal; overflow-wrap: anywhere;
}
.badge.aqhi-1 { background: #009e49; }
.badge.aqhi-2 { background: #f2c200; color: #3a2f00; }
.badge.aqhi-3 { background: #f28c00; }
.badge.aqhi-4 { background: #e02020; }
.badge.aqhi-5 { background: #8b0000; }
/* 泳灘等級徽章不在此處上色：色碼由 JS 的 BEACH_COLOR 對照表提供並以
   inline style 套用，確保圖例色塊、Popup 徽章、地圖標記三者永遠一致。
   等級 1 為淺青而非綠色（官方 EPD 慣例），文字色因此隨等級而異。 */
/* 量測值徽章（溶解氧／五天生化需氧量）：中性色 —— 官方沒有等級評級，
   不可借用等級色盤，否則會誤導成「官方分級」。 */
.badge.badge-param {
  background: var(--bg-secondary); color: var(--text-primary);
  border: 1px solid var(--border-color);
}

.custom-popup .cp-foot {
  margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color);
  color: var(--text-secondary); font-size: calc(10.5px * var(--fs)); line-height: 1.5;
}
.custom-popup .cp-desc {
  color: var(--text-secondary); font-size: calc(11px * var(--fs)); line-height: 1.5;
  margin: 0 0 8px; font-style: italic;
  /* 右上角是關閉按鈕 —— 預留右側內距，說明文字才不會被 × 蓋住 */
  padding: 12px 40px 0 13px;
}
.custom-popup .cp-desc + .cp-title { border-top: 0; }

/* MarkerCluster 主題化 */
.marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
  background-color: color-mix(in srgb, var(--tab-active) 28%, transparent);
}
.marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
  background-color: var(--tab-active); color: #fff; font-weight: 700;
}
.marker-cluster { border-radius: 50%; }

/* L10 噪音影像為灰階圖（黑色代表無資料／低噪音）。
   用 screen 混合模式讓黑色「消失」、亮部疊加在地圖上，讀起來像熱力圖。 */
.l10-tile { mix-blend-mode: screen; }

/* 自訂標記 */
.pin {
  width: 22px; height: 22px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); border: 2px solid #fff;
  box-shadow: 0 1px 5px rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center;
}

   ============================================================ */

  position: absolute; left: 50%; top: calc(var(--header-h) + 16px);

  display: none; align-items: center; gap: 10px;
  padding: 9px 16px; border-radius: 999px;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); box-shadow: var(--shadow);
  font-size: calc(12.5px * var(--fs)); font-weight: 600;
}
.loading.show { display: flex; }
.spinner {
  width: 16px; height: 16px; flex: 0 0 auto;
  border: 2.5px solid color-mix(in srgb, var(--tab-active) 25%, transparent);
  border-top-color: var(--tab-active);
  border-radius: 50%; animation: spin .75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast（錯誤提示） */
.toast {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px);
  z-index: 1300; opacity: 0; pointer-events: none;
  max-width: min(90vw, 420px);
  padding: 10px 16px; border-radius: 10px;
  background: #b3261e; color: #fff; font-size: calc(12.5px * var(--fs)); line-height: 1.45;
  box-shadow: var(--shadow-strong);
  transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* A2HS 提示 */
.a2hs {
  position: absolute; right: 12px; top: calc(var(--header-h) + 12px); z-index: 1150;
  display: none; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 10px; cursor: pointer;
  background: var(--popup-bg); color: var(--popup-text);
  border: 1px solid var(--border-color); box-shadow: var(--shadow);
  font-size: calc(12px * var(--fs)); font-family: inherit; font-weight: 600;
}
.a2hs.show { display: flex; }
.a2hs .close-x {
  border: 0; background: transparent; color: var(--text-secondary);
  cursor: pointer; font-size: calc(15px * var(--fs)); line-height: 1; padding: 2px 4px;
}

/* 螢幕閱讀器專用 */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;

   響應式：平板 768–1024
   ============================================================ */
@media (max-width: 1024px) {

  .tab .tab-label { display: none; }
  .tab { padding: 0 14px; }
  .tab .tab-icon { font-size: 18px; }
  .custom-popup { max-width: 260px; width: 260px; }
}

/* ============================================================
   響應式：手機 < 768 → 底部導航欄
   ============================================================ */
@media (max-width: 767px) {
  :root { --header-h: 52px; --bottomnav-h: 60px; }
  .topbar { padding: 0 10px; }
  /* 手機多了 A−／A+ 兩顆按鈕，品牌必須可以縮（否則頂欄會爆出畫面）。
     標題改為依可用寬度自動省略，不再用固定 46vw。 */
  .brand { flex: 0 1 auto; min-width: 0; }
  .brand h1 { font-size: calc(13px * var(--fs)); max-width: none; overflow: hidden; text-overflow: ellipsis; }
  .tabs { display: none; }                       /* 手機隱藏頂部 Tab */

  .actions { margin-left: auto; }
  .icon-btn { min-width: 40px; min-height: 40px; border-radius: 9px; }

  #map { inset: var(--header-h) 0 calc(var(--bottomnav-h) + env(safe-area-inset-bottom)) 0; }

  /* 底部導航欄 */
  .bottom-nav {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1200;
    display: flex; align-items: stretch;
    height: calc(var(--bottomnav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg-primary);
    border-top: 1px solid var(--border-color);
  }
  .bottom-nav .tab {
    flex: 1 1 0; flex-direction: column; gap: 3px;
    justify-content: center; min-height: 44px; padding: 4px 2px;
    border-radius: 0; border-bottom: 0; border-top: 3px solid transparent;
    font-size: calc(10px * var(--fs));
  }
  .bottom-nav .tab[aria-selected="true"] {
    border-top-color: var(--tab-active); background: transparent;
  }
  .bottom-nav .tab .tab-icon { font-size: 19px; }
  .bottom-nav .tab .tab-label { display: block; max-width: 22vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottom-nav .tab .err-dot { top: 5px; right: 22%; }

  /* 手機：圖例可折疊（抬到底部導航欄之上） */
  .legend {
    right: 8px; left: 8px; max-width: none;
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px);
    max-height: 46vh; overflow-y: auto;
  }
  /* 手機：子分頁浮在底部導覽列之上（左緣對齊「水質數據」按鈕，由 JS 設定）；
     圖例與提示再往上讓開，避免疊在一起 */
  .sub-tabs {
    top: auto; left: 8px; right: auto; max-width: calc(100vw - 16px); z-index: 1250;
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px);
  }
  /* 手機：箭嘴改指向下方的底部導覽列。
     注意：只改「旋轉」（由 JS 設為 225°），不可再改邊框所在的一側 ——
     邊框留在上／左，轉 225° 後尖端自然朝下；兩者都改會互相抵銷。 */
  body.has-subtabs .legend {
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px + var(--subtab-h) + 6px);
  }
  body.has-subtabs .toast {
    bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 12px + var(--subtab-h) + 6px);
  }
  .legend.collapsed .legend-body { display: none; }
  .legend-toggle { display: inline-flex; align-items: center; justify-content: center; }
  .legend-head { cursor: pointer; position: sticky; top: 0; background: var(--bg-secondary); }

  /* 手機：Popup 字體縮小、關閉按鈕加大 */
  /* 寬度必須 <= Leaflet 的 maxWidth（各圖層為 300／320），否則 .custom-popup

     畫面寬過 333px 就會超寬（600px 畫面實測超寬 237px）。現改為
     min(300px, 100vw-60px)：留 30px 邊距，窄機自動收窄。 */
  .custom-popup {
    max-width: min(300px, calc(100vw - 60px));
    width: min(300px, calc(100vw - 60px));
    font-size: calc(12px * var(--fs));
  }
  .custom-popup .cp-title { font-size: calc(15px * var(--fs)); padding-right: 46px; }
  .custom-popup .cp-desc { padding-right: 46px; }
  .custom-popup .cp-label { min-width: 72px; font-size: calc(11.5px * var(--fs)); }
  .leaflet-container a.leaflet-popup-close-button {
    font-size: 24px; width: 36px; height: 36px;
  }
  .a2hs { top: auto; bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 10px); }
  .toast { bottom: calc(var(--bottomnav-h) + env(safe-area-inset-bottom) + 12px); }
}
@media (min-width: 768px) { .bottom-nav { display: none; } }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

  /* ======================================================================
     2. 資料來源（全部已驗證可跨網域直接存取）
     ====================================================================== */
  const CSDI_WFS = 'https://portal.csdi.gov.hk/server/services/common';
  const wfsUrl = (ds, layer) =>
    `${CSDI_WFS}/${ds}/MapServer/WFSServer?service=WFS&version=2.0.0&request=GetFeature` +
    `&typeNames=${encodeURIComponent('csdi:' + layer)}&outputFormat=GeoJSON&srsName=EPSG:4326&count=20000`;
  /* 註：CSDI 的 ArcGIS query 以 f=geojson 輸出時極不穩定（實測約 3–5/6 成功），
     改用 f=json（Esri JSON，實測約 11/12），再於前端轉換為 GeoJSON。 */
  const arcQuery = (ds, layer, fields) =>
    `https://portal.csdi.gov.hk/server/rest/services/common/${ds}/MapServer/${layer}/query` +
    `?where=1%3D1&outFields=${encodeURIComponent(fields)}&returnGeometry=true&outSR=4326&f=json`;

  /* 圖層查詢的通用版本（供需要 where／幾何簡化／分頁的圖層使用）。
     - where：ArcGIS SQL，預設 1=1
     - offset／precision：maxAllowableOffset（Douglas-Peucker，單位為度）與
       geometryPrecision。實測生境圖用 offset=0.00005（約 5 米）可把 15.3MB
       減至約 9MB，而在本網站可見的縮放級數下看不出差異。 */
  const arcLayerUrl = (ds, layer, opts) => {
    const o = opts || {};
    let u = `https://portal.csdi.gov.hk/server/rest/services/common/${ds}/MapServer/${layer}/query` +
      `?where=${encodeURIComponent(o.where || '1=1')}` +
      `&outFields=${encodeURIComponent(o.fields || '*')}` +
      `&returnGeometry=true&outSR=4326&f=json`;
    if (o.offset) u += `&maxAllowableOffset=${o.offset}`;
    if (o.precision) u += `&geometryPrecision=${o.precision}`;
    return u;
  };

  /* 「公眾可使用的電動車充電器」欄位清單。
     官方欄位名帶有空格／雙底線／尾隨底線（例如 MEDIUM_GB_T20234_2_AC__no、
     REMARK_FOR__OTHERS_），必須逐字照抄，否則 ArcGIS 會回 HTTP 200 +
     錯誤主體，靜默變成「0 筆」。（資料集名稱：geotagging） */
  const EV_FIELDS =
    'NAME_OF_DISTRICT_COUNCIL_DISTRICT_EN,LOCATION_EN,ADDRESS_EN,' +
    'NAME_OF_DISTRICT_COUNCIL_DISTRICT_TC,LOCATION_TC,ADDRESS_TC,' +

    'QUICK_CHAdeMO_no,QUICK_CCS_DC_COMBO_no,QUICK_IEC62196_no,' +
    'QUICK_GB_T20234_3_DC__no,QUICK_OTHERS_no,' +
    'FAST_CHAdeMO_no,FAST_CCS_DC_COMBO_no,FAST_GB_T20234_3_DC__no,' +

     L1 是 layercateg／layername／reportname，L11 是 LayerCateg／LayerName／ReportName，
     L3 用 figno（其餘用 FigNo）。一次查詢要跨 16 個圖層時，只能挑各層共有的欄位，
     或接受部分欄位為空 —— 前端取值時一律做大小寫容錯（見 habitatCatKey／habitatLabel）。 */
  const HABITAT_FIELDS =

  /* 過去泳灘水質數據的年份範圍（相對於執行時的年份往前推，不會隨時間失效）。
     注意日期欄位是 DD/MM/YYYY 字串，故用 LIKE '%/YYYY' 比對年份尾巴，
     亦因此 where 會隨年份變長，只保留最近 HIST_BEACH_YEARS 年。 */
  const HIST_BEACH_YEARS = 10;
  /* 每個泳灘在歷史圖上顯示最近多少次採樣。
     這不是「時間範圍」而是「採樣次數」——官方約每週採樣，故 24 次只覆蓋約 7 個月，
     會令人誤以為只有半年資料（實際官方數據由 1986 年起齊全）。96 次約覆蓋 2–3 年。 */
  const HIST_BEACH_POINTS = 96;

  function histBeachWhere() {
    const now = new Date().getFullYear();
    const clauses = [];
    for (let y = now; y > now - HIST_BEACH_YEARS; y--) {
      clauses.push(`Sampling_Date__DD_MM_YYYY_ LIKE '%/${y}'`);
    }
    return clauses.join(' OR ');
  }
  /* 單一泳灘的歷史序列查詢（不取幾何：每筆採樣的座標都相同，取幾何純屬浪費。
     只在使用者於彈窗按下「歷史記錄」時才呼叫，故不影響載入時間。） */
  function histBeachSeriesUrl(beachName) {
    return arcLayerUrl('epd_rcd_1631502008200_88073', 0, {
      where: `Beach_Name = '${String(beachName).replace(/'/g, "''")}' AND (${histBeachWhere()})`,
      fields: 'OBJECTID,Beach_Name,Beach_Name__TC_,Sampling_Date__DD_MM_YYYY_,' +
        'E__coli_count_per_100mL_on_the_sampling_date'
    }) + '&returnGeometry=false&orderByFields=OBJECTID+DESC' +
      `&resultRecordCount=${HIST_BEACH_POINTS}`;
  }

       同一批泳灘，獨立成一個圖層只會令載入時間變長（40 個泳灘序列）並重複
       同一批標記。改為在泳灘彈窗內按「歷史記錄」即時查該泳灘的序列。 */
    { id: 'water',   icon: '💧', short: { tc: '水質',   en: 'WQ' }, subs: ['beach', 'marine', 'river'] },
    { id: 'recycle', icon: '♻️', short: { tc: '回收',   en: 'GC' } },
    { id: 'ev',      icon: '🔌', short: { tc: '充電',   en: 'EV' } },
    { id: 'noise',   icon: '🔇', short: { tc: '噪音',   en: 'LNRS' } },
    { id: 'cnp',     icon: '🚧', short: { tc: '許可證', en: 'CNP' } },
    { id: 'habitat', icon: '🌿', short: { tc: '生境',   en: 'EIA' } }
  ];

  /* 「水質數據」分頁的子分頁（同時就是圖層 id） */
  const WATER_SUBS = ['beach', 'marine', 'river'];

  const state = {
    lang: 'tc',
    theme: 'light',
    fs: 0,                      // 字體大小級數索引（見 FS_STEPS），0 = 最小
    active: 'air',              // 目前分頁 id（＝TABS 的 id）
    waterSub: 'beach',          // 「水質數據」分頁下選用的子分頁＝圖層 id
    layers: { air: null, beach: null, marine: null, river: null, recycle: null, ev: null, noise: null, cnp: null, habitat: null },
    noiseSub: { lnrs: true, l10: false },
    errors: {},
    loaded: {},
    loading: {},
    meta: {},                 // 每個圖層的來源／更新時間
    aqhi: null,
    popupLayer: null
  };

  /* 分頁 → 圖層：水質數據分頁有三個子分頁，其餘分頁與圖層同名。
     分頁 id 與圖層 id 分開之後，分頁只負責「選哪一組資料」，
     圖層快取（layers／loaded／errors／loading）一律以圖層 id 為鍵。 */
  function activeLayerId() {
    return state.active === 'water' ? state.waterSub : state.active;
  }
  /* 圖層 → 所屬分頁（載入中／錯誤指示要標在主分頁上） */
  function tabOfLayer(id) {
    return WATER_SUBS.indexOf(id) >= 0 ? 'water' : id;
  }

  let map, basemapLayer, labelLayer, l10Layer, activeLayer = null;
  let legendTouched = false;     // 使用者是否手動展開／收合過圖例
  const layers = state.layers;   // 規格要求：圖層存於全域 layers 物件

  /* ======================================================================
     4. 小工具
     ====================================================================== */
  const $ = (sel) => document.querySelector(sel);

  function t(path) {
    const parts = String(path).split('.');
    let node = i18n[state.lang];
    for (const p of parts) {
      if (node == null) return '';
      node = node[p];
    }
    return node == null ? '' : node;
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fmtDateTime(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  function fmtDate(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function debounce(fn, ms) {
    let timer = null;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 5000);
  }

  /* ======================================================================
     5. 24 小時 localStorage 數據緩存
     ====================================================================== */
  const cache = {
    get(key, ttl) {
      try {
        const raw = localStorage.getItem('hk-env-cache:' + key);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || typeof obj.ts !== 'number') return null;
        if (Date.now() - obj.ts > (ttl || CACHE_TTL)) {
          localStorage.removeItem('hk-env-cache:' + key);
          return null;
        }
        return obj.data;
      } catch (e) { return null; }
    },
    set(key, data) {
      try {
        localStorage.setItem('hk-env-cache:' + key,
          JSON.stringify({ ts: Date.now(), data: data }));
        return true;
      } catch (e) {
        // 超出配額：清掉舊快取後重試一次，仍失敗則放棄（不影響功能）
        try {
          Object.keys(localStorage)
            .filter((k) => k.indexOf('hk-env-cache:') === 0)
            .forEach((k) => localStorage.removeItem(k));
          localStorage.setItem('hk-env-cache:' + key,
            JSON.stringify({ ts: Date.now(), data: data }));
          return true;
        } catch (e2) {
          console.warn('[cache] 無法寫入 localStorage（可能超出配額），已略過快取：', key);
          return false;
        }
      }
    }
  };

  /* ======================================================================
     6. 資料抓取
     ====================================================================== */
  /* CSDI 的 ArcGIS 服務由多台後端負載平衡，實測同一請求約有 20–30% 機會
     回傳 404 或 HTTP 200 + 錯誤主體（例如「Service ... not found」）。
     因此對這類暫時性錯誤加入指數退避重試。 */
  function NetError(message, retriable) {
    const e = new Error(message);
    e.retriable = !!retriable;
    return e;
  }

  /* 對同一主機的並行請求上限，並限制「起跑速率」。
     背景：生境圖一次過抓 16 個圖層、過去泳灘水質逐個泳灘抓 40 條序列，
     全部同時打 portal.csdi.gov.hk 會觸發限流，連帶令其他圖層
     （空氣質素、海水水質、建築噪音許可證、低噪音路面）出現「Failed to fetch」。
     只設並行上限仍會出現突發（實測每次固定有 4 個請求失敗，數目與上限相同，
     且每次失敗的圖層都不同），故再加上起跑間隔把請求攤開。 */
  const CSDI_MAX_CONCURRENT = 4;
  const CSDI_MIN_START_GAP_MS = 80;
  const fetchQueue = { active: 0, waiting: [], nextStart: 0 };

  function withFetchSlot(fn) {
    return new Promise((resolve, reject) => {
      const run = () => {
        /* 攤開起跑時間：接連的請求至少相隔 CSDI_MIN_START_GAP_MS */
        const now = Date.now();
        const delay = Math.max(0, fetchQueue.nextStart - now);
        fetchQueue.nextStart = Math.max(now, fetchQueue.nextStart) + CSDI_MIN_START_GAP_MS;
        fetchQueue.active++;
        setTimeout(() => {
          Promise.resolve().then(fn).then(
            (v) => { fetchQueue.active--; drainFetchQueue(); resolve(v); },
            (e) => { fetchQueue.active--; drainFetchQueue(); reject(e); }
          );
        }, delay);
      };
      if (fetchQueue.active < CSDI_MAX_CONCURRENT) run();
      else fetchQueue.waiting.push(run);
    });
  }
  function drainFetchQueue() {
    while (fetchQueue.active < CSDI_MAX_CONCURRENT && fetchQueue.waiting.length) {
      fetchQueue.waiting.shift()();
    }
  }

  async function fetchJson(url, tries) {
    const maxTries = tries || 8;
    let lastErr;
    for (let i = 0; i < maxTries; i++) {
      try {
        return await withFetchSlot(() => fetchJsonOnce(url));
      } catch (e) {
        lastErr = e;
        if (!e.retriable || i === maxTries - 1) throw e;
        await new Promise((r) => setTimeout(r, 300 * Math.pow(1.8, i)));
      }
    }
    throw lastErr;
  }

  async function fetchJsonOnce(url) {
    let res;
    try {
      res = await fetch(url, { mode: 'cors', credentials: 'omit' });
    } catch (e) {
      throw NetError('網絡錯誤：' + (e && e.message ? e.message : e), true);
    }
    if (!res.ok) {
      const retriable = res.status === 404 || res.status === 408 || res.status === 425 ||
        res.status === 429 || res.status >= 500;
      throw NetError('HTTP ' + res.status, retriable);
    }
    const text = await res.text();
    const trimmed = text.trimStart();
    if (!(trimmed.startsWith('{') || trimmed.startsWith('['))) {
      throw NetError('回應不是 JSON（可能被閘道攔截）', true);
    }
    let data;
    try { data = JSON.parse(text); }
    catch (e) { throw NetError('JSON 解析失敗', true); }

    // ArcGIS / 政府 API 的錯誤會以 HTTP 200 + JSON 錯誤主體回傳，
    // 必須明確攔截，否則會靜默地變成「0 筆」這種看似正常的錯誤結果。
    if (data && data.error) {
      const msg = (data.error && (data.error.message || data.error.details)) || '服務回報錯誤';
      const transient = /not found|timeout|unavailable|busy|try again|overloaded/i.test(String(msg));
      throw NetError('API 錯誤：' + msg, transient);
    }
    return data;
  }

  /* Esri JSON → GeoJSON（ArcGIS query 使用 f=json 輸出） */
  function esriToGeoJson(esri) {
    if (!esri || !Array.isArray(esri.features)) {
      throw NetError('API 錯誤：回應缺少 features 陣列', true);
    }
    const features = esri.features.map((f) => {
      const a = f.attributes || {};
      const g = f.geometry;
      let geometry = null;
      if (g) {
        if (typeof g.x === 'number' && typeof g.y === 'number') {
          geometry = { type: 'Point', coordinates: [g.x, g.y] };
        } else if (Array.isArray(g.paths)) {
          geometry = g.paths.length === 1
            ? { type: 'LineString', coordinates: g.paths[0] }
            : { type: 'MultiLineString', coordinates: g.paths };
        } else if (Array.isArray(g.rings)) {
          geometry = { type: 'Polygon', coordinates: g.rings };
        }
      }
      return { type: 'Feature', geometry: geometry, properties: a };
    });
    return { type: 'FeatureCollection', features: features };
  }

  /* ArcGIS 圖層取得（必要時分頁；Esri JSON 轉 GeoJSON） */
  async function fetchArcLayer(cfg) {
    const pageSize = cfg.pageSize || 3000;
    const out = [];
    let offset = 0;
    for (let guard = 0; guard < 40; guard++) {
      const url = cfg.url + `&resultOffset=${offset}&resultRecordCount=${pageSize}`;
      const esri = await fetchJson(url);
      const fc = esriToGeoJson(esri);
      out.push(...fc.features);
      const more = esri.exceededTransferLimit === true && fc.features.length >= pageSize;
      if (!more) break;
      offset += pageSize;
    }
    return { type: 'FeatureCollection', features: out };
  }

  /* 帶快取的 JSON 取得（供 AQHI 等非 GeoJSON 資料使用） */
  async function getCachedJson(cacheKey, url, ttl) {
    let data = cache.get(cacheKey, ttl);
    let fromCache = !!data;
    if (!data) {
      data = await fetchJson(url);
      cache.set(cacheKey, data);
    }
    console.log(`[效能] ${cacheKey}：${Array.isArray(data) ? data.length : '—'} 筆` +
      `${fromCache ? '（來自快取）' : '（網絡請求）'}`);
    return data;
  }

  /* 帶快取的圖層資料取得 */
  async function getLayerData(id) {
    const cfg = DATA[id];
    const started = performance.now();
    let data = cfg.cacheKey ? cache.get(cfg.cacheKey, cfg.cacheTtl) : null;
    let fromCache = !!data;

    if (!data) {
      data = cfg.arcgis ? await fetchArcLayer(cfg) : await fetchJson(cfg.url);
      /* 註：只快取「非空」結果。過去泳灘水質的逐灘序列是這個圖層載入之後才抓的，
         若抓取失敗，彈窗會明確顯示「載入失敗」，不會靜默當成沒有資料；
         圖層本身在記憶體中已載入，同一 session 不會重複抓取。 */
      if (cfg.cacheKey && data.features && data.features.length) cache.set(cfg.cacheKey, data);
    }
    const ms = Math.round(performance.now() - started);
    console.log(`[效能] ${t('datasetNames.' + cfg.datasetKey)}：${data.features ? data.features.length : '—'} 筆，` +
      `${ms} ms${fromCache ? '（來自 24 小時快取）' : '（網絡請求）'}`);
    return data;
  }

  /* ======================================================================
     7. AQHI 對照
     ====================================================================== */
  /* 監測站名稱對照：AQMN 的 Facility_Name → AQHI 數據的 station
     （兩個來源的識別碼不同，必須明確對照，不可直接互相代入） */
  function stationKey(facilityName) {
    return String(facilityName || '')
      .replace(/\s*Air Quality Monitoring Station\s*$/i, '')
      .trim();
  }

  /* 空氣質素健康指數 → 健康風險級別（官方五級：低、中、高、甚高、嚴重） */
  function riskLevelOf(aqhi) {
    const v = Number(aqhi);
    if (!isFinite(v)) return null;
    if (v >= 11) return 'serious';    // 10+
    if (v >= 8) return 'veryHigh';    // 8–10
    if (v >= 7) return 'high';        // 7
    if (v >= 4) return 'moderate';    // 4–6
    return 'low';                     // 1–3
  }

  /* AQHI 數值 → 顏色級別（1-3 綠 / 4-6 黃 / 7 橙 / 8-10 紅 / 10+ 深紅） */
  function aqhiClass(aqhi) {
    const v = Number(aqhi);
    if (!isFinite(v)) return 'aqhi-1';
    if (v >= 11) return 'aqhi-5';
    if (v >= 8) return 'aqhi-4';
    if (v >= 7) return 'aqhi-3';
    if (v >= 4) return 'aqhi-2';
    return 'aqhi-1';
  }
  const AQHI_COLOR = { 'aqhi-1': '#009e49', 'aqhi-2': '#f2c200', 'aqhi-3': '#f28c00', 'aqhi-4': '#e02020', 'aqhi-5': '#8b0000' };
  const RISK_KEY = { low: 'low', moderate: 'medium', high: 'high', veryHigh: 'veryHigh', serious: 'serious' };

  /* ---- 泳灘水質等級 ----
     官方 EPD「最新泳灘水質等級」圖例用色：1 淺青、2 亮綠、3 琥珀、4 紅。
     注意等級 1 並非綠色而是淺青（官方慣例），故以明確對照表釘死色碼，
     不按「好＝綠、差＝紅」自行推導。圖例色塊、Popup 徽章與地圖標記共用
     此表，避免三者各自漂移；未開放／未評級＝中性灰。 */
  function beachGrade(p) {
    const src = String(p.Beach_Gradings_TC || p.Beach_Grading_SC || p.Beach_Gradings || '');
    const m = src.match(/(\d)/);
    const n = m ? Number(m[1]) : null;
    return n && BEACH_COLOR[n] ? n : null;
  }
  const BEACH_COLOR = { 1: '#7CE7F0', 2: '#4CE84C', 3: '#F5C33B', 4: '#F0433D' };
  /* 淺色底（1／2／3 級）需配深色字，4 級紅底用白字 */
  const BEACH_TEXT = { 1: '#06323a', 2: '#0b3d0b', 3: '#4a3400', 4: '#ffffff' };
  const BEACH_CLOSED_COLOR = '#9AA7B0';
  const BEACH_CLOSED_TEXT = '#1f2a30';
  const BEACH_LEGEND_KEY = { 1: 'good', 2: 'fair', 3: 'poor', 4: 'veryPoor' };

  /* ---- 泳灘 → 地區 ----
     CSDI 泳灘數據集只有泳灘名稱與等級，並無「地區」欄位，因此地區須由對照表
     提供。下表按環保署官方泳灘名單分區（屯門 6／荃灣 8／離島 10／大埔 1／
     西貢 6／南區 12，共 43 個）；已核對數據集實際發布的 40 個泳灘 100% 命中，
     而 Hairpin Beach、Rocky Bay Beach、Gemini Beaches 三個不在數據集內。
     注意：數據集有 3 個名稱帶尾隨空白（Anglers' Beach、Cheung Chau Tung Wan
     Beach、Trio Beach），故查表前必須先 trim，否則會靜默查不到地區。 */
  const BEACH_DISTRICT = {
    // Southern District — 南區
    'Big Wave Bay Beach': 'Southern District',
    'Chung Hom Kok Beach': 'Southern District',
    'Deep Water Bay Beach': 'Southern District',
    'Hairpin Beach': 'Southern District',
    'Middle Bay Beach': 'Southern District',

    // Islands District — 離島區

  const DISTRICT_TC = {
    'Southern District': '南區',
    'Tsuen Wan District': '荃灣區',
    'Tuen Mun District': '屯門區',
    'Tai Po District': '大埔區',

  };
  /* 數據集無地區欄位 → 以英文泳灘名查表；名稱務必先 trim。 */
  function beachDistrict(p) {
    return BEACH_DISTRICT[String(p.Beach || '').trim()] || null;
  }
  /* 地區名按語言顯示；查不到時回退原文，不會變空白。 */
  function districtLabel(d) {

  }

  /* ---- 近期海水／河溪水質數據 ----
     數據集只提供溶解氧（DO）及五天生化需氧量（BOD5）的實測值，並沒有官方等級
     評級（河溪水質指數 RWCZI 等並不在此數據集內），因此地圖上每個監測站只用
     單一顏色標示，不按數值自行分級 —— 憑空訂門檻等同偽造官方評級。
     另注意數值可能是「<0.1」這種低於檢測限的字串，必須原樣顯示，不可強轉數字。 */
  const WATER_COLOR = { marine: '#1565c0', river: '#00838f' };
  const WATER_GLYPH = { marine: '🌊', river: '💧' };

  function waterStationName(p) {
    return state.lang === 'tc'
      ? (p.A_Station_C || p.A_Station_Eng || p.A_Station)
      : (p.A_Station_Eng || p.A_Station_C || p.A_Station);
  }
  /* which: 'do' | 'bod'。回傳原樣字串（可能是「<0.1」），無值回傳 null。 */
  function waterValue(p, which) {
    const en = which === 'do' ? p.C_Dissolved_Oxygen_Eng : p.C_BOD5_Eng;
    const tc = which === 'do' ? p.C_Dissolved_Oxygen_C : p.C_BOD5_C;
    const v = state.lang === 'tc' ? (tc || en) : (en || tc);
    return v == null || String(v).trim() === '' ? null : String(v).trim();
  }
  function waterLink(p) {
    return state.lang === 'tc' ? (p.D_Link_C || p.D_Link_Eng) : (p.D_Link_Eng || p.D_Link_C);
  }
  /* 水質管制區（官方 10 區）。數據集只有測站名稱（例如 "TM3-Harbour Subzone"），
     並無管制區欄位；下表取自環保署「近期的海水水質資料」頁的
     「管制區（測站代號）」對照，代號就是數據集的 A_Station。
     數據集剛好每區一個測站，故這就是官方的分組方式。 */
  const MARINE_ZONE = {
    VM5:  { en: 'Victoria Harbour',         tc: '維多利亞港' },
    DM3:  { en: 'Deep Bay',                 tc: '后海灣' },
    EM2:  { en: 'Eastern Buffer',           tc: '東部緩衝區' },
    JM4:  { en: 'Junk Bay',                 tc: '將軍澳' },

  /* 測站 → 官方水質管制區名稱；未知代號回傳 null，不亂猜 */
  function marineZone(p) {

  }

  /* ---- 已簽發的建築噪音許可證 ----
     許可證類別以官方英文值作鍵（穩定），中文標籤用官方中文值。
     顏色只區分「類別」，不是評級；撞擊式打樁工程用較重的紅色，
     因為它是《噪音管制條例》下受更嚴格管制的工程類別。 */
  /* 已簽發的建築噪音許可證：官方連結。
     實測官方並無「以許可證編號直接開啟」的網址（逐一驗證，非猜測）：
       - 數據集 URL 欄位 1,962 張全部相同，且只是 EPIC 搜尋頁的入口
         （帶 JSF 的 execution 參數；無 cookie 時 302 循環，瀏覽器內可開）；
       - EPIC「建築噪音許可證」搜尋頁（apps-construct）是公開頁面，但須過
         驗證碼（BotDetect），且只可按類別／地區／日期／工地地址／承辦商搜尋，
         並無「許可證編號」欄位 —— 無法用編號直達，亦無法以網址預填；
       - data.gov.hk 的「API Available」只等於 CSDI 的 WFS／WMS／ArcGIS REST
         （本圖層已在用），該圖層 hasAttachments=false，沒有許可證文件。
     故彈窗只提供 EPIC 搜尋頁連結（唯一能實際查找／下載許可證的官方入口）。 */
  /* 環保署 EPIC「建築噪音許可證」網上搜尋頁。
     實測只有 ?lang=en 能穩定直達（其他 lang 值會 302 循環），
     故一律指向英文版；使用者在該頁可自行切換繁體／簡體。 */
  const CNP_SEARCH_URL = 'https://epic.epd.gov.hk/EFORMUPD/main/epic/apps-construct?lang=en';
  const CNP_TYPE_TC = {
    'General Construction Works': '一般建築工程',
    'Percussive Piling': '撞擊式打樁工程'
  };
  const CNP_COLOR = {
    'General Construction Works': '#f28c00',
    'Percussive Piling': '#c62828'
  };
  const CNP_TEXT = {
    'General Construction Works': '#3a2f00',
    'Percussive Piling': '#ffffff'
  };
  const CNP_COLOR_FALLBACK = '#6d4c41';
  /* 許可證類別 → 目前語言標籤。
     eng 為官方英文值（對照表鍵），chin 為資料本身的官方中文值。
     未知類別回退官方原文，不會變空白。 */
  function cnpTypeLabel(eng, chin) {
    if (state.lang !== 'tc') return eng || chin || '';
    return CNP_TYPE_TC[eng] || chin || eng || '';
  }
  function cnpColor(eng) {
    return CNP_COLOR[eng] || CNP_COLOR_FALLBACK;
  }
  /* 「現況」由官方 VALIDITY（"YYYY-MM-DD - YYYY-MM-DD"）與今日日期推算。
     這不是數據集原有欄位，UI 上必須標明是推算值。 */
  const CNP_STATUS_KEY = { active: 'permitActive', expired: 'permitExpired', upcoming: 'permitUpcoming' };
  function cnpStatus(p) {
    const m = String(p.VALIDITY || '').match(/(\d{4}-\d{2}-\d{2})\s*-\s*(\d{4}-\d{2}-\d{2})/);
    if (!m) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(m[1] + 'T00:00:00');
    const end = new Date(m[2] + 'T23:59:59');
    if (isNaN(start) || isNaN(end)) return null;
    if (today < start) return 'upcoming';
    if (today > end) return 'expired';
    return 'active';
  }

  /* 低噪音路面材質 → 顯示文字（官方欄位 materials 原值） */
  const MATERIAL_LABEL = { PMFC: 'PMFC', PMSMA6: 'PMSMA6', CRSMA6: 'CRSMA6' };

  /* 回收點設施類別（官方 legend 欄位原值）→ 中文 */
  const RECYCLE_CAT_TC = {
    'Recycling Bins at Public Place': '公眾地方回收箱',
    'Private Collection Points (e.g. housing estates, shopping centres)': '私人回收點（例如屋苑、商場）',
    'Smart Bin': '智能回收箱',
    'Recycling Spots': '回收流動點',
    'Street Corner Recycling Shops': '街角回收店',
    'Recycling Stations/Recycling Stores': '回收環保站／回收便利點',
    'NGO Collection Points': '非政府機構回收點'
  };
  /* 「綠在區區」回收網絡所屬的設施類別 */
  const GREEN_COMMUNITY_CATS = [
    'Recycling Stations/Recycling Stores',
    'Street Corner Recycling Shops',
    'Recycling Spots'
  ];

  /* ---- 公眾可使用的電動車充電器 ----
     數據集把充電器按「充電速度」（標準／中速／快速／高速）乘「插頭標準」交叉列表，
     共 17 個 *_no 欄位，大部分為 0。只顯示大於 0 的組合，並依官方欄位順序排列，
     不自行重新排序或加總成單一數字（官方沒有「總充電器數」這個欄位）。
     注意欄位名有尾隨底線：MEDIUM_GB_T20234_2_AC__no、FAST_GB_T20234_3_DC__no、
     REMARK_FOR__OTHERS_。 */
  const EV_FIELDS_BY_SPEED = [
    { speed: 'standard', fields: ['STANDARD_BS1363_no'] },
    { speed: 'medium', fields: ['MEDIUM_IEC62196_no', 'MEDIUM_SAEJ1772_no', 'MEDIUM_CCS_DC_COMBO_no', 'MEDIUM_GB_T20234_2_AC__no', 'MEDIUM_OTHERS_no'] },
    { speed: 'quick', fields: ['QUICK_CHAdeMO_no', 'QUICK_CCS_DC_COMBO_no', 'QUICK_IEC62196_no', 'QUICK_GB_T20234_3_DC__no', 'QUICK_OTHERS_no'] },
    { speed: 'fast', fields: ['FAST_CHAdeMO_no', 'FAST_CCS_DC_COMBO_no', 'FAST_GB_T20234_3_DC__no', 'FAST_OTHERS_no'] }
  ];
  /* 速度 → 顏色。只用於區分「速度」這個類別，不是評級。 */
  const EV_SPEED_COLOR = { standard: '#455a64', medium: '#00796b', quick: '#1565c0', fast: '#6a1b9a' };
  const EV_SPEED_TEXT = { standard: '#ffffff', medium: '#ffffff', quick: '#ffffff', fast: '#ffffff' };
  /* 官方欄位名 → 插頭標準的顯示名稱（取官方欄位名的中段，去掉速度前綴與 _no 後綴） */
  function evStandardKey(field) {
    return field.replace(/^(STANDARD|MEDIUM|QUICK|FAST)_/, '').replace(/_+no$/, '');
  }
  /* 回傳 [[speed, standardKey, count], ...]，只含 count > 0，順序依官方欄位順序。 */
  function evConnectors(p) {
    const out = [];
    EV_FIELDS_BY_SPEED.forEach((grp) => {
      grp.fields.forEach((f) => {
        const raw = p[f];
        if (raw == null || String(raw).trim() === '') return;
        const n = Number(raw);
        if (!isFinite(n) || n <= 0) return;
        out.push([grp.speed, evStandardKey(f), n]);
      });
    });
    return out;
  }
  /* 總充電器數（僅用於 tooltip／排序顯示，UI 上必須說明是自行加總） */
  function evTotal(p) {
    return evConnectors(p).reduce((a, c) => a + c[2], 0);
  }
  function evLocation(p) {
    return state.lang === 'tc'
      ? (p.LOCATION_TC || p.LOCATION_EN)
      : (p.LOCATION_EN || p.LOCATION_TC);
  }
  function evAddress(p) {
    return state.lang === 'tc'
      ? (p.ADDRESS_TC || p.ADDRESS_EN)
      : (p.ADDRESS_EN || p.ADDRESS_TC);
  }
  function evDistrict(p) {
    return state.lang === 'tc'
      ? (p.NAME_OF_DISTRICT_COUNCIL_DISTRICT_TC || p.NAME_OF_DISTRICT_COUNCIL_DISTRICT_EN)
      : (p.NAME_OF_DISTRICT_COUNCIL_DISTRICT_EN || p.NAME_OF_DISTRICT_COUNCIL_DISTRICT_TC);
  }

  /* ---- 實時可用情況 ----
     官方實時檔案（ev-charger.epd.gov.hk 的 evca_ver_1_0.json，約 3.8MB）
     對任何 Origin 都不回 Access-Control-Allow-Origin，OPTIONS 更回 405，
     故靜態網頁無法直接抓取（已逐項實測確認，非猜測）。
     解決方法：由建置腳本（tools/build-ev-availability.mjs，可經 GitHub Actions
     定時執行）在瀏覽器以外抓取，縮減後寫成同源的 data/ev-availability.json，
     網頁只讀自己的檔案，因此沒有跨網域問題。
     注意 data/ev-availability.json 不存在時（例如未設定 Action）會靜靜降級為
     只顯示靜態數目，並保留連到官方查詢頁的連結。 */
  const EV_AVAIL_LOCAL = 'data/ev-availability.json';
  let evAvailIndex = null;      // Map<coordKey, record>
  let evAvailMeta = null;       // 快照中繼資料

  /* 必須與 tools/build-ev-availability.mjs 的 coordKey() 完全一致 */
  const evCoordKey = (lat, lng) => Number(lat).toFixed(5) + ',' + Number(lng).toFixed(5);

  /* 抓取同源快照。改為「按需要」才抓（第一次開彈窗時），
     不再在載入圖層時一併下載 —— 實測該檔約 156KB，對首次顯示圖層是純粹的延遲。
     失敗時回傳 null 並降級為只顯示靜態數目。 */
  let evAvailPromise = null;

  function ensureEvAvail() {
    if (evAvailPromise) return evAvailPromise;
    evAvailPromise = fetchJson(EV_AVAIL_LOCAL).then((j) => {
      const map = new Map();
      const byCoord = (j && j.byCoord) || {};
      Object.keys(byCoord).forEach((k) => map.set(k, byCoord[k]));
      evAvailIndex = map;
      evAvailMeta = {
        generatedAt: j && j.generatedAt,
        upstreamLastUpdate: j && j.upstreamLastUpdate,
        withAvailability: j && j.withAvailability
      };
      console.info(`[電動車] 實時快照：${map.size} 個位置，` +
        `${evAvailMeta.withAvailability} 個有官方實時數字（快照時間 ${evAvailMeta.generatedAt}）`);
      return map;
    }).catch((e) => {
      console.warn('[電動車] 未找到實時快照，只顯示靜態數目：', e && e.message);
      evAvailIndex = null;
      return null;
    });
    return evAvailPromise;
  }

  function evAvailFor(latlng) {
    if (!evAvailIndex || !latlng) return null;
    return evAvailIndex.get(evCoordKey(latlng.lat, latlng.lng)) || null;
  }
  /* 沒有快照時的唯一退路：連到官方查詢頁（該頁不經 CORS，可直接瀏覽） */
  const EV_OFFICIAL_URL = 'https://ev-charger.epd.gov.hk/';

  /* ---- 過去泳灘水質數據 ----
     關鍵：數據集有 63,099 筆，但「每個泳灘只有一個固定座標」——
     實測 10 年 16,324 筆採樣只對應 43 個不同的東／北座標（即 43 個泳灘）。
     所以把每筆採樣都畫成一個標記是錯的：只會在同一點上疊 300 多個標記，
     既令地圖變成無意義的大數字，又要傳 7MB 資料。
     正確做法：每個泳灘一個標記，彈窗顯示該泳灘的歷史大腸桿菌數列。
     官方只有大腸桿菌實測值，並無等級評級，故不按數值自行評級上色。 */
  const HIST_BEACH_COLOR = '#0277bd';
  const HIST_BEACH_TEXT = '#ffffff';

  /* "7/4/1986" → Date（日/月/年）；直接 new Date() 會當成美式 MM/DD 而錯置月份 */
  function histBeachParseDate(v) {
    const m = String(v || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (!m) return null;
    const d = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    return isNaN(d.getTime()) ? null : d;
  }
  function histBeachDateStr(v) {
    const d = histBeachParseDate(v);
    return d ? fmtDate(d) : null;
  }
  /* 大腸桿菌數目（每 100 毫升）。官方為字串，可能是「<10」這種低於檢測限的值，
     必須原樣顯示與比較，不可強轉數字後當成一般數值。 */
  function histBeachEcoli(p) {
    const v = p.E__coli_count_per_100mL_on_the_sampling_date;
    return v == null || String(v).trim() === '' ? null : String(v).trim();
  }
  /* 取數值版本（「<10」當作 10 畫圖，但文字仍原樣顯示） */
  function histBeachNum(txt) {
    if (txt == null) return null;
    const m = String(txt).match(/(\d+(?:\.\d+)?)/);
    return m ? Number(m[1]) : null;
  }

  /* 歷史序列快取（鍵為官方英文泳灘名）與載入狀態，全部按需要才抓取。
     因為改為在使用者按「歷史記錄」時才查單一泳灘，故不會拖慢載入。 */
  const beachHistoryCache = {};   // key → { status: 'loading'|'ok'|'error', series: [] }

  /* ---- 環評報告中的生境圖 ----
     16 個圖層各代表一個生境類別。顏色只用於區分生境類別，不是評級。
     類別鍵取自要素的 layercateg（注意各圖層大小寫不一致：
     L1 用 layercateg，L11 用 LayerCateg），故比對前一律轉小寫。
     size ＝ 實測的傳輸大小（MB，offset=0.00005／precision=5），
     只用於決定「先載入哪幾層」——先畫細層，最快見到東西。 */
  const HABITAT_LAYERS = [
    { id: 1,  key: 'woodland',            tc: '林地',            color: '#1b5e20', size: 1.30 },
    { id: 8,  key: 'shrubland',           tc: '灌木林',          color: '#558b2f', size: 0.32 },
    { id: 12, key: 'grasslandshrubland',  tc: '草地／灌木地',     color: '#9ccc65', size: 0.90 },
    { id: 13, key: 'grassland',           tc: '草地',            color: '#c5e1a5', size: 0.00 },
    { id: 6,  key: 'uplandgrassland',     tc: '高地草原',         color: '#dcedc8', size: 0.02 },
    { id: 2,  key: 'wetland',             tc: '濕地',            color: '#00838f', size: 0.17 },
    { id: 11, key: 'marsh',               tc: '沼澤',            color: '#00695c', size: 0.24 },
    { id: 9,  key: 'pond',                tc: '魚塘／水塘',       color: '#26c6da', size: 0.39 },
    { id: 3,  key: 'watercourse',         tc: '水道',            color: '#1565c0', size: 1.29 },
    { id: 0,  key: 'seasonalwatercourse', tc: '季節性水道',       color: '#42a5f5', size: 0.99 },
    { id: 15, key: 'agriculturalland',    tc: '農地',            color: '#f9a825', size: 0.00 },
    { id: 10, key: 'plantation',          tc: '人工林',          color: '#33691e', size: 0.00 },
    { id: 5,  key: 'villagearea',         tc: '鄉村範圍',         color: '#8d6e63', size: 0.50 },
    { id: 14, key: 'developedarea',       tc: '已發展地區',       color: '#90a4ae', size: 1.75 },
    { id: 4,  key: 'wasteland',           tc: '荒地',            color: '#a1887f', size: 0.53 },
    { id: 7,  key: 'sssi',                tc: '具特殊科學價值地點', color: '#d81b60', size: 0.00 }
  ];
  const HABITAT_FALLBACK_COLOR = '#78909c';

  function habitatLayerDef(layerId) {
    return HABITAT_LAYERS.filter((h) => h.id === layerId)[0] || null;
  }
  /* 生境類別鍵（小寫）；優先用要素的 layercateg，沒有才回退圖層名稱 */
  function habitatCatKey(p) {
    const raw = p.layercateg || p.LayerCateg || p.layername || p.LayerName || '';
    return String(raw).toLowerCase().replace(/[^a-z]/g, '');
  }
  function habitatColor(layerId, p) {
    const byCat = HABITAT_LAYERS.filter((h) => h.key === habitatCatKey(p))[0];
    if (byCat) return byCat.color;
    const byLayer = habitatLayerDef(layerId);
    return byLayer ? byLayer.color : HABITAT_FALLBACK_COLOR;
  }
  function habitatLabel(layerId, p) {
    if (state.lang === 'tc') {
      const byCat = HABITAT_LAYERS.filter((h) => h.key === habitatCatKey(p))[0];
      if (byCat) return byCat.tc;
    }
    const raw = p.layername || p.LayerName || p.layercateg || p.LayerCateg || '';
    return String(raw).trim() || (habitatLayerDef(layerId) ? habitatLayerDef(layerId).tc : '');
  }

  /* ======================================================================
     8. 標記圖示
     ====================================================================== */
  function pinIcon(color, glyph) {
    return L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${color}"><span>${glyph}</span></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 22],
      popupAnchor: [0, -22]
    });
  }
  /* ======================================================================
     9. Popup 內容
     ====================================================================== */
  function popupShell(title, descHtml, rowsHtml, footExtra) {
    return `<div class="custom-popup">
      ${descHtml || ''}
      <h3 class="cp-title">${esc(title)}</h3>
      <div class="cp-body">
        ${rowsHtml}
        <div class="cp-foot">
          <span class="cp-src">${esc(t('popup.source'))}</span>${footExtra ? '<br>' + footExtra : ''}
        </div>
      </div>
    </div>`;
  }

  function row(label, valueHtml) {
    return `<div class="cp-row"><span class="cp-label">${esc(label)}</span><span class="cp-value">${valueHtml}</span></div>`;
  }

  /* 標籤與內容上下堆疊的列（內容遠比標籤長時使用，避免擠出卡片外） */
  function rowStack(label, valueHtml) {
    return `<div class="cp-row cp-row--stack"><span class="cp-label">${esc(label)}</span><span class="cp-value">${valueHtml}</span></div>`;
  }

  /* ---- 空氣質素 Popup ---- */
  function airPopup(p, aqhi) {
    const name = state.lang === 'tc' ? (p['設施名稱'] || p.Facility_Name) : (p.Facility_Name || p['設施名稱']);
    const addr = state.lang === 'tc' ? (p['地址'] || p.Address) : (p.Address || p['地址']);
    const stype = state.lang === 'tc' ? (p['空氣質素監測站類別'] || p.Types_of_Air_Quality_Monitoring_Station)
                                      : (p.Types_of_Air_Quality_Monitoring_Station || p['空氣質素監測站類別']);
    let rows = '';
    if (addr) rows += row(t('popup.address'), `<span class="cp-address">${esc(addr)}</span>`);
    if (stype) rows += row(t('popup.stationType'), esc(stype));

    if (aqhi) {
      const cls = aqhiClass(aqhi.aqhi);
      const riskKey = riskLevelOf(aqhi.aqhi);
      rows = row(t('popup.aqhi'), `<span class="badge ${cls}">${esc(aqhi.aqhi)}</span>`) +
        row(t('popup.riskLevel'), `<span class="badge ${cls}">${esc(t('legend.' + RISK_KEY[riskKey]))}</span>`) +
        rows +
        rowStack(t('popup.lastUpdate'), esc(String(aqhi.publish_date).replace('T', ' ').slice(0, 16)));
    }
    rows += row(t('ui.dataFetched'), esc(state.meta.air || fmtDateTime(new Date())));
    const desc = `<p class="cp-desc">${esc(t('datasetDescriptions.airNetwork'))}</p>`;
    return popupShell(name || '—', desc, rows);
  }

  /* ---- 泳灘 Popup ---- */
  function beachPopup(p) {
    const isTc = state.lang === 'tc';
    // 名稱／等級優先用官方中文原文（數據集本身就有 Beach_TC，非自行翻譯）
    const name = isTc ? (p.Beach_TC || p.Beach) : (p.Beach || p.Beach_TC);
    const gradeRaw = isTc ? (p.Beach_Gradings_TC || p.Beach_Gradings)
                          : (p.Beach_Gradings || p.Beach_Gradings_TC);
    const g = beachGrade(p);
    const color = g ? BEACH_COLOR[g] : BEACH_CLOSED_COLOR;
    const textColor = g ? BEACH_TEXT[g] : BEACH_CLOSED_TEXT;
    const gradeLabel = g ? t('legend.' + BEACH_LEGEND_KEY[g]) : t('legend.notOpen');
    // 色碼以 inline style 套用 → 徽章、圖例色塊、地圖標記共用同一份 BEACH_COLOR
    const badge = `<span class="badge" style="background:${color};color:${textColor}">${esc(gradeLabel)}</span>`;
    const key = String(p.Beach || '').trim();
    const view = beachHistoryView[key] || 'grade';
    let rows = '';
    // 地區：數據集並無此欄位，由對照表提供（詳見 BEACH_DISTRICT 註解）
    const dist = beachDistrict(p);
    if (dist) rows += row(t('popup.district'), esc(districtLabel(dist)));

    /* 兩個檢視共用同一個彈窗（同一批泳灘、同一個位置，故不另設分頁）：
       「水質等級」＝官方最新等級；「歷史記錄」＝該泳灘的大腸桿菌數列圖。 */
    const tabs = `<div class="cp-tabs">
      <button type="button" class="cp-tab${view === 'grade' ? ' is-on' : ''}"
              data-bh-view="grade">${esc(t('ui.beachTabGrade'))}</button>
      <button type="button" class="cp-tab${view === 'history' ? ' is-on' : ''}"
              data-bh-view="history">${esc(t('ui.beachTabHistory'))}</button>
    </div>`;
    rows += rowStack(t('ui.beachViewLabel'), tabs);

    if (view === 'history') {
      rows += beachHistorySection(p);
    } else {
      rows += row(t('popup.waterQuality'),
        badge + ' <span class="cp-sub">' + esc(gradeRaw || '—') + '</span>');
      // 官方數據集沒有採樣日期 → 誠實標示，不憑空生成
      rows += row(t('popup.sampleDate'), `<span class="cp-sub">${esc(t('ui.noSamplingDate'))}</span>`);
    }
    rows += row(t('ui.dataFetched'), esc(state.meta.beach || fmtDateTime(new Date())));
    const link = p.link_beach
      ? `<a href="${esc(p.link_beach)}" target="_blank" rel="noopener">EPD 泳灘水質報告</a>`
      : '';
    const desc = `<p class="cp-desc">${esc(t('datasetDescriptions.beachGrading'))}</p>`;
    return popupShell(name || '—', desc, rows, link);
  }

  /* 泳灘彈窗內的檢視切換（事件委派）。
     Leaflet 的彈窗內容是惰性求值的函式，改狀態後不會自動重畫，
     故這裡主動關閉再重新開啟同一個標記，讓它依新狀態重新產生內容。

     取回泳灘圖層用 map._popup._source —— 實測它就是該泳灘的圖層物件。
     不可用 DOM 元素的 _leaflet_id 反查：泳灘標記放在 markerClusterGroup 內，
     DOM 上的 id 屬於叢集的代理標記，與圖層 id 不同（實測 DOM=1941、圖層=190）。 */
  /* ---- 圖表放大 ----
     彈窗內的歷史圖表很小（寬約 254px），點一下就在畫面中央放大重看。同一張 SVG
     帶 viewBox，放大時刻度與日期會一起等比放大，不會失真。
     Esc／點背景／按 × 都可關閉。 */
  let chartModal = null;
  function closeChartModal() {
    if (!chartModal) return;
    chartModal.hidden = true;
    chartModal.querySelector('.chart-modal__body').innerHTML = '';
  }
  function openChartModal(svgHtml, title) {
    if (!chartModal) {
      chartModal = document.createElement('div');
      chartModal.className = 'chart-modal';
      chartModal.hidden = true;
      chartModal.innerHTML =
        '<div class="chart-modal__backdrop"></div>' +
        '<div class="chart-modal__box" role="dialog" aria-modal="true">' +
          '<div class="chart-modal__head">' +
            '<h4 class="chart-modal__title"></h4>' +
            '<button type="button" class="chart-modal__close" aria-label="' +
              esc(t('ui.chartClose')) + '">\u00d7</button>' +
          '</div>' +
          '<div class="chart-modal__body"></div>' +
        '</div>';
      document.body.appendChild(chartModal);
      chartModal.querySelector('.chart-modal__backdrop').addEventListener('click', closeChartModal);
      chartModal.querySelector('.chart-modal__close').addEventListener('click', closeChartModal);
      document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape') closeChartModal(); });
    }
    chartModal.querySelector('.chart-modal__title').textContent = title || '';
    chartModal.querySelector('.chart-modal__body').innerHTML = svgHtml;
    chartModal.hidden = false;
  }

  function onMapPopupClick(e) {
    /* 點圖表即放大（放在其他按鈕判斷之前；圖表本身不是按鈕，不會互相干擾） */
    const chartEl = e.target && e.target.closest ? e.target.closest('.hb-chart[data-chart-title]') : null;
    if (chartEl) {
      const svg = chartEl.querySelector('svg');
      if (svg) openChartModal(svg.outerHTML, chartEl.getAttribute('data-chart-title'));
      return;
    }
    /* 海水／河溪彈窗的「最新數據／歷史記錄」切換（版面與泳灘水質卡一致）。
       快照是首次進入歷史檢視時才抓；抓完要重畫，故完成後再關閉並重開同一彈窗。 */
    const wqBtn = e.target && e.target.closest ? e.target.closest('[data-wq-view]') : null;
    if (wqBtn && e.target.closest('#map')) {
      const layer = map && map._popup && map._popup._source;
      if (!layer || !layer.feature) return;
      const key = wqBtn.getAttribute('data-wq-key');
      const view = wqBtn.getAttribute('data-wq-view');
      const kind = wqBtn.getAttribute('data-wq-kind');
      if (!key || !view) return;
      /* 以「圖層 + 測站代號」為鍵：海水與河溪的代號可能重號，否則會互相干擾 */
      const vk = kind + '|' + key;
      wqHistoryView[vk] = view;
      if (view === 'history') {
        ensureWqHistory().then(() => {
          if (wqHistoryView[vk] !== 'history') return;
          layer.closePopup(); layer.openPopup();
        });
      }
      layer.closePopup(); layer.openPopup();
      return;
    }

    const btn = e.target && e.target.closest ? e.target.closest('[data-bh-view]') : null;
    if (!btn || !e.target.closest('#map')) return;
    const layer = map && map._popup && map._popup._source;
    if (!layer || !layer.getLatLng || !layer.feature) return;

    const view = btn.getAttribute('data-bh-view');
    const key = String((layer.feature.properties || {}).Beach || '').trim();
    if (!key) return;
    beachHistoryView[key] = view;

    if (view === 'history' && !beachHistoryCache[key]) {
      /* 進入歷史檢視時才查該泳灘的序列；查完若仍停在歷史檢視就重畫 */
      loadBeachHistory(key).then(() => {
        if (beachHistoryView[key] !== 'history') return;
        layer.closePopup();
        layer.openPopup();
      });
    }
    layer.closePopup();
    layer.openPopup();
  }

  /* ---- 近期海水／河溪水質數據 Popup ---- */
  function waterPopup(p, kind) {
    const name = waterStationName(p);
    /* 河溪歷史以河名為主鍵，海水以測站代號為主鍵（兩者代號可能重號，故分開） */
    const key = kind === 'river' ? wqRiverKey(p) : String(p.A_Station || '').trim();
    const view = wqHistoryView[kind + '|' + key] || 'latest';
    let rows = '';
    /* 官方分組：海水＝水質管制區（見 MARINE_ZONE）；河溪的官方分組就是河溪本身，
       已顯示在彈窗標題，故不重複列一行。 */
    if (kind === 'marine') {
      const zone = marineZone(p);
      if (zone) rows += row(t('popup.waterZone'), esc(zone));
    }
    if (p.A_Station) rows += row(t('popup.stationCode'), esc(key));

    /* 兩個檢視共用同一個彈窗（同一測站、同一位置，故不另設分頁）：
       「最新數據」＝官方最新一次採樣；「歷史記錄」＝官方歷史 CSV 快照的數列圖。
       版面與泳灘水質卡一致。 */
    const tabs = `<div class="cp-tabs">
      <button type="button" class="cp-tab${view === 'latest' ? ' is-on' : ''}"
              data-wq-view="latest" data-wq-kind="${esc(kind)}" data-wq-key="${esc(key)}">${esc(t('ui.wqTabLatest'))}</button>
      <button type="button" class="cp-tab${view === 'history' ? ' is-on' : ''}"
              data-wq-view="history" data-wq-kind="${esc(kind)}" data-wq-key="${esc(key)}">${esc(t('ui.beachTabHistory'))}</button>
    </div>`;
    rows += rowStack(t('ui.beachViewLabel'), tabs);

    if (view === 'history') {
      if (!wqHistorySnapshot) ensureWqHistory();   // 首次進入時才抓快照
      rows += wqHistorySnapshot
        ? wqHistorySection(kind, key)
        : rowStack(t('popup.histTrendWq'),
            `<span class="cp-sub">${esc(t('ui.wqHistLoading'))}</span>`);
    } else {
      const doVal = waterValue(p, 'do');
      const bodVal = waterValue(p, 'bod');
      if (p.B_Sampling_Date) rows += row(t('popup.samplingDate'), esc(String(p.B_Sampling_Date).trim()));
      /* 標籤已含官方單位（毫克/升），故只顯示原值 */
      rows += row(t('popup.dissolvedOxygen'),
        doVal == null ? '—' : `<span class="badge badge-param">${esc(doVal)}</span>`);
      rows += row(t('popup.bod5'),
        bodVal == null ? '—' : `<span class="badge badge-param">${esc(bodVal)}</span>`);
    }
    rows += row(t('ui.dataFetched'), esc(state.meta[kind] || fmtDateTime(new Date())));
    const link = waterLink(p);
    const linkHtml = link
      ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(t('datasetNames.' + DATA[kind].datasetKey))}</a>`
      : '';
    const desc = `<p class="cp-desc">${esc(t('datasetDescriptions.' + DATA[kind].datasetKey))}</p>`;
    return popupShell(name || '—', desc, rows, linkHtml);
  }

       1. 數據集內的 URL 欄位：1,962 張許可證全部是同一個 EPIC 搜尋頁入口

  /* ---- 公眾可使用的電動車充電器 Popup ---- */
  function evPopup(p, latlng) {

    if (conns.length) {

      if (avail.updated) rows += rowStack(t('popup.availUpdated'), esc(String(avail.updated)));

    rows += rowStack(t('ui.dataFetched'), esc(state.meta.ev || fmtDateTime(new Date())));

  /* ---- 過去泳灘水質 Popup（含大腸桿菌數列圖） ---- */
  /* 大腸桿菌水平 → 官方泳灘等級色盤的級別（僅用於配色，非官方評級） */
  function beachGradeFromEcoli(n) {
    if (n == null || !isFinite(n)) return null;
    if (n <= 24) return 1;
    if (n <= 179) return 2;
    if (n <= 609) return 3;
    return 4;
  }
  /* 把序列畫成簡單長條圖（純 SVG，不引入圖表庫）。
     顏色沿用官方泳灘等級色盤（該色盤本身即按大腸桿菌水平劃分）；
     圖例與彈窗都註明官方並無為歷史數據評級，避免誤讀成官方等級。 */
  /* 序列已按 OBJECTID 由新至舊排序，故最舊的在陣列末端 */
  function histBeachSpanDays(series) {
    if (!series || series.length < 2) return null;
    const a = histBeachParseDate(series[series.length - 1].rawDate);
    const b = histBeachParseDate(series[0].rawDate);
    return (a && b) ? Math.round((b - a) / 86400000) : null;
  }
  /* 與海水／河溪歷史圖共用同一個外框（chartFrame），故也有 Y 軸單位與刻度標籤；
     長條仍按官方泳灘等級色盤上色（僅作視覺分級，非官方評級）。 */
  function histBeachChart(series) {
    if (!series || !series.length) return '';
    const nums = series.map((s) => histBeachNum(s.ecoli) || 0);
    const max = Math.max.apply(null, nums.concat([1]));
    const g = chartBarGeom(series.length);
    const bars = series.map((s, i) => {
      const v = nums[i];
      const h = Math.max(1, Math.round((v / max) * g.plotH));
      const gr = beachGradeFromEcoli(v);
      const c = (gr && BEACH_COLOR[gr]) || HIST_BEACH_COLOR;
      return `<rect x="${(CHART.x0 + i * (g.bw + g.gap)).toFixed(2)}" y="${(CHART.y1 - h).toFixed(1)}" ` +
        `width="${g.bw.toFixed(2)}" height="${h}" fill="${c}"></rect>`;
    }).join('');
    const oldest = series[series.length - 1], newest = series[0];
    return chartFrame(bars, max, t('popup.ecoliShort'), t('popup.histTrend'),
      oldest.dateStr || '', newest.dateStr || '');
  }

  /* 按需要抓取單一泳灘的歷史序列（只在使用者按下「歷史記錄」時呼叫）。
     快取在記憶體，同一泳灘再開不會重複查詢。 */
  function loadBeachHistory(key) {
    const cached = beachHistoryCache[key];
    if (cached) return Promise.resolve(cached);
    const entry = { status: 'loading', series: [] };
    beachHistoryCache[key] = entry;
    return fetchJson(histBeachSeriesUrl(key)).then((j) => {
      const feats = (j && j.features) || [];
      entry.series = feats.map((ft) => {
        const a = ft.attributes || ft.properties || {};
        const raw = a.Sampling_Date__DD_MM_YYYY_;
        return { ecoli: histBeachEcoli(a), rawDate: raw, dateStr: histBeachDateStr(raw) };
      });
      entry.status = 'ok';
      return entry;
    }).catch((e) => {
      console.warn(`[泳灘歷史] ${key} 查詢失敗：`, e);
      entry.status = 'error';
      return entry;
    });
  }

  /* 歷史記錄檢視（彈窗內切換） */
  const beachHistoryView = {};

  function beachHistorySection(p) {
    const key = String(p.Beach || '').trim();
    const entry = beachHistoryCache[key];
    if (!entry || entry.status === 'loading') {
      return rowStack(t('popup.histTrend'),
        `<span class="cp-sub">${esc(t('ui.histBeachLoading'))}</span>`);
    }
    if (entry.status === 'error') {
      return rowStack(t('popup.histTrend'),
        `<span class="cp-sub">${esc(t('ui.histBeachLoadFailed'))}</span>`);
    }
    const series = entry.series;
    if (!series.length) {
      return rowStack(t('popup.histTrend'),
        `<span class="cp-sub">${esc(t('ui.histBeachNoData'))}</span>`);
    }
    const latest = series[0];
    const nums = series.map((s) => histBeachNum(s.ecoli)).filter((v) => v != null);
    const avg = nums.length ? Math.round(nums.reduce((a, b) => a + b, 0) / nums.length) : null;
    const peak = nums.length ? Math.max.apply(null, nums) : null;
    let rows = rowStack(t('popup.histTrend'), histBeachChart(series));
    /* 跨度原本畫在圖下的軸列；日期已移進圖表內（與海水一致），此處只留跨度 */
    const spanDays = histBeachSpanDays(series);
    if (spanDays != null) {
      rows += `<div class="cp-sub">${esc(t('popup.histSpan').replace('{n}', String(spanDays)))}</div>`;
    }
    const g = beachGradeFromEcoli(histBeachNum(latest.ecoli));
    rows += row(t('popup.ecoliLatest'),
      latest.ecoli == null ? '—'
        : `<span class="badge" style="background:${(g && BEACH_COLOR[g]) || HIST_BEACH_COLOR};` +
          `color:${(g && BEACH_TEXT[g]) || HIST_BEACH_TEXT}">${esc(latest.ecoli)}</span>`);
    if (latest.dateStr) rows += row(t('popup.samplingDate'), esc(latest.dateStr));
    rows += row(t('popup.histSamples'), esc(String(series.length)));
    if (avg != null) rows += row(t('popup.histAvg'), esc(String(avg)));
    if (peak != null) rows += row(t('popup.histPeak'), esc(String(peak)));
    return rows;
  }

  /* ---- 海水／河溪的歷史記錄 ----
     官方開放數據（CSDI）只有測站清單，沒有歷史測量值；真正的歷史數據只在環保署
     的互動頁面上。故由建置腳本（tools/build-wq-history.mjs，可經 GitHub Actions
     定時執行）以無頭瀏覽器下載官方 CSV，縮減後寫成同源的 data/wq-history.json，
     網頁只讀自己的檔案，因此沒有跨網域問題。
     序列格式：[日期, 溶解氧(mg/L), 五天生化需氧量(mg/L)]，缺值為 null。 */
  const WQ_HISTORY_URL = 'data/wq-history.json';
  let wqHistoryPromise = null;
  let wqHistorySnapshot = null;      // 快照（載入後才會有值）
  const wqHistoryView = {};          // 測站代號 → 'latest' | 'history'

  function ensureWqHistory() {
    if (wqHistoryPromise) return wqHistoryPromise;
    wqHistoryPromise = fetchJson(WQ_HISTORY_URL).then((j) => {
      wqHistorySnapshot = j;
      console.info(`[水質歷史] 快照：海水 ${Object.keys((j && j.marine) || {}).length} 站、` +
        `河溪 ${Object.keys((j && j.river) || {}).length} 站（快照時間 ${j && j.generatedAt}）`);
      return j;
    }).catch((e) => {
      console.warn('[水質歷史] 未找到歷史快照，只顯示最新數據：', e && e.message);
      wqHistorySnapshot = null;
      return null;
    });
    return wqHistoryPromise;
  }
  /* 河溪歷史快照以「河名」為主鍵（官方 CSV 的 River_Name），但官方互動地圖的河溪
     圖層以測站代號 A_Station 為主鍵、河名在 A_Station_Eng。兩者需對應：彈窗改用
     河名去撈歷史序列。個別河名在兩套資料中有別名（如 "Shing Mun River" 在歷史檔
     寫成 "Shing Mun Main Channel"），在此統一映射。 */
  const WQ_RIVER_ALIAS = { 'Shing Mun River': 'Shing Mun Main Channel' };
  function wqRiverKey(p) {
    const eng = String(p && p.A_Station_Eng || '').trim();
    if (!eng) return '';
    return WQ_RIVER_ALIAS[eng] || eng;
  }
  function wqSeriesFor(kind, key) {
    const g = wqHistorySnapshot && wqHistorySnapshot[kind];
    let rec = g && g[key];
    /* 河溪別名備援：萬一傳入的是未對應過的河名，仍嘗試別名鍵 */
    if (!rec && kind === 'river') rec = g && g[WQ_RIVER_ALIAS[key]];
    return rec && Array.isArray(rec.series) && rec.series.length ? rec.series : null;
  }
  /* 與泳灘卡同一種長條圖，但只用單色 —— 官方沒有為溶解氧／生化需氧量訂等級，
     故不自行分級上色（與其他圖層一致的做法）。which: 1 = 溶解氧、2 = 生化需氧量
     版面：左邊留位放 Y 軸刻度與單位，下面留位放日期；viewBox + width:100%，
     令圖表隨彈窗寬度一起放大，看得更清楚。 */
  /* ---- 歷史圖表共用外框 ----
     海水／河溪與泳灘的歷史圖共用同一個外框，版面才一致：左邊留位放 Y 軸刻度與
     單位、0／一半／最大三條淡格線、下面留位放最舊／最新日期。viewBox + width:100%
     令圖表隨容器寬度縮放 —— 放大時也一樣清楚，不會失真。 */
  const CHART = { W: 260, H: 120, x0: 32, x1: 258, y0: 20, y1: 98 };
  /* 360 個採樣也要全部塞進同一個寬度：點數多時不留間隙，且不設下限
     （先前用 max(1.2, …) 會令長條總寬超出繪圖區，後半被裁掉）。 */
  function chartBarGeom(n) {
    const plotW = CHART.x1 - CHART.x0;
    const gap = n > 120 ? 0 : (n > 60 ? 1 : 2);
    const bw = Math.max(0.35, (plotW - gap * (n - 1)) / n);
    return { gap, bw, plotH: CHART.y1 - CHART.y0 };
  }
  function chartFrame(bars, max, unit, label, oldest, newest) {
    const { W, H, x0, x1, y1 } = CHART;
    const plotH = y1 - CHART.y0;
    const nice = (v) => (v >= 100 ? String(Math.round(v)) : String(Math.round(v * 10) / 10));
    const yAxis = [0, max / 2, max].map((tv) => {
      const y = y1 - (tv / max) * plotH;
      return `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" ` +
        `stroke="currentColor" stroke-opacity="0.14" stroke-width="1"></line>` +
        `<text x="${x0 - 4}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" ` +
        `fill="currentColor" fill-opacity="0.7">${esc(nice(tv))}</text>`;
    }).join('');
    /* data-chart-title 同時是「可放大」的標記（見 openChartModal） */
    return `<div class="hb-chart" data-chart-title="${esc(label)}" title="${esc(t('ui.chartEnlarge'))}">
      <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(label)}">
        <text x="1" y="12" font-size="10" fill="currentColor" fill-opacity="0.7">${esc(unit || '')}</text>
        ${yAxis}
        ${bars}
        <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="currentColor" stroke-opacity="0.4" stroke-width="1"></line>
        <text x="${x0}" y="${y1 + 15}" font-size="10" fill="currentColor" fill-opacity="0.7">${esc(oldest)}</text>
        <text x="${x1}" y="${y1 + 15}" text-anchor="end" font-size="10" fill="currentColor" fill-opacity="0.7">${esc(newest)}</text>
      </svg>
    </div>`;
  }
  /* 官方沒有為溶解氧／生化需氧量訂等級，故不自行分級上色（與其他圖層一致）。
     which: 1 = 溶解氧、2 = 生化需氧量 */
  function wqChart(series, which, color, label, unit) {
    /* 有些河溪測站只公佈溶解氧、沒有生化需氧量 —— 整條序列都是缺值時不要畫
       一排零高度的假長條，直接標示「沒有數據」。 */
    const has = series.some((s) => { const v = parseFloat(s[which]); return isFinite(v); });
    if (!has) {
      return `<div class="hb-chart hb-chart-empty"><span class="cp-sub">${esc(t('ui.wqHistNoData'))}</span></div>`;
    }
    const nums = series.map((s) => { const v = parseFloat(s[which]); return isFinite(v) ? v : 0; });
    const max = Math.max.apply(null, nums.concat([0.0001]));
    const g = chartBarGeom(series.length);
    const bars = series.map((s, i) => {
      const h = Math.max(1, Math.round((nums[i] / max) * g.plotH));
      return `<rect x="${(CHART.x0 + i * (g.bw + g.gap)).toFixed(2)}" y="${(CHART.y1 - h).toFixed(1)}" ` +
        `width="${g.bw.toFixed(2)}" height="${h}" fill="${color}"></rect>`;
    }).join('');
    const oldest = series[0][0] || '', newest = series[series.length - 1][0] || '';
    return chartFrame(bars, max, unit, label, oldest, newest);
  }
  /* 最新值／期間平均（自行計算，會標明） */
  function wqStats(series, which) {
    const nums = series.map((s) => parseFloat(s[which])).filter((v) => isFinite(v));
    if (!nums.length) return { latest: null, avg: null };
    const last = series[series.length - 1][which];
    return {
      latest: last,
      avg: Math.round((nums.reduce((a, b) => a + b, 0) / nums.length) * 10) / 10
    };
  }
  function wqHistorySection(kind, key) {
    const color = WATER_COLOR[kind] || HIST_BEACH_COLOR;
    const series = wqSeriesFor(kind, key);
    if (!series) {
      /* 整個河溪都沒有匹配的歷史序列（例如官方互動地圖有該測站、但歷史檔沒有）：
         給出與「只有溶氧、沒有生化需氧量」相同的「沒有數據」樣式，避免畫出空白。 */
      return rowStack(t('popup.histTrendWq'),
        `<div class="hb-chart hb-chart-empty"><span class="cp-sub">${esc(t('ui.wqHistNoData'))}</span></div>`);
    }
    const doS = wqStats(series, 1), bodS = wqStats(series, 2);
    const fmt = (v) => (v == null || v === '' ? '—' : String(v));
    const UNIT = 'mg/L';
    let rows = rowStack(t('popup.histTrendWq'), wqChart(series, 1, color, t('popup.histTrendWq'), UNIT));
    rows += rowStack(t('popup.histTrendBod'), wqChart(series, 2, color, t('popup.histTrendBod'), UNIT));
    rows += row(t('popup.samplingDate'), esc(String(series[series.length - 1][0] || '—')));
    rows += row(t('popup.histSamples'), esc(String(series.length)));
    /* 標籤一行、數值一行：值含「最新值 + 期間平均」，同排會擠成多行 */
    if (doS.avg != null) {
      rows += rowStack(t('popup.dissolvedOxygen'),
        `${esc(fmt(doS.latest))} <span class="cp-sub">${esc(t('popup.histAvg'))} ${esc(String(doS.avg))}</span>`);
    }
    if (bodS.avg != null) {
      rows += rowStack(t('popup.bod5'),
        `${esc(fmt(bodS.latest))} <span class="cp-sub">${esc(t('popup.histAvg'))} ${esc(String(bodS.avg))}</span>`);
    }
    return rows;
  }

  /* ======================================================================
     10. 圖層建立
     ====================================================================== */
  function clusterIfNeeded(layer, count) {
    if (count > CLUSTER_THRESHOLD) {
      console.log(`[效能] ${count} 個要素 > ${CLUSTER_THRESHOLD}，啟用 markercluster 聚合`);
    }
    return layer;
  }

  function makeClusterGroup() {
    return L.markerClusterGroup({
      showCoverageOnHover: false,
      spiderfyOnMaxZoom: true,
      chunkedLoading: true,
      chunkInterval: 200,
      maxClusterRadius: 55,
      disableClusteringAtZoom: 16,
      iconCreateFunction: function (cluster) {
        const n = cluster.getChildCount();
        const size = n < 10 ? 'small' : (n < 100 ? 'medium' : 'large');
        return L.divIcon({
          html: `<div><span>${n}</span></div>`,
          className: 'marker-cluster marker-cluster-' + size,
          iconSize: L.point(40, 40)
        });
      }
    });
  }

  /* ---- 空氣質素圖層（API + 空間關聯） ---- */
  async function loadAirLayer() {
    const [geo, aqhiList] = await Promise.all([
      getLayerData('air'),
      getCachedJson(DATA.aqhi.cacheKey, DATA.aqhi.url, DATA.aqhi.cacheTtl).catch((e) => {
        console.warn('[空氣] AQHI 數據取得失敗，只顯示監測站位置：', e);
        return null;
      })
    ]);

    const byKey = {};
    if (Array.isArray(aqhiList)) {
      aqhiList.forEach((a) => { byKey[String(a.station).trim()] = a; });
      state.aqhi = aqhiList;
    }

    // 對照檢查：確認每個監測站都能在 AQHI 資料中找到對應
    const unmatched = [];
    const group = makeClusterGroup();
    let matched = 0;

    const layer = L.geoJSON(geo, {
      pointToMarker: true,
      onEachFeature: (feature, lyr) => {
        const p = feature.properties || {};
        const key = stationKey(p.Facility_Name);
        const a = byKey[key];
        if (a) matched++; else unmatched.push(p.Facility_Name);
        const aqhiVal = a ? a.aqhi : null;
        const color = aqhiVal != null ? AQHI_COLOR[aqhiClass(aqhiVal)] : '#7f8c8d';
        lyr.setIcon(pinIcon(color, '🌬'));
        lyr.bindPopup(() => airPopup(p, a), { className: 'custom-popup-wrap', maxWidth: 300, autoPan: true, autoPanPadding: [30, 60] });
        // 同上：tooltip 延遲求值，避免切換語言後殘留舊語言
        lyr.bindTooltip(() => esc(state.lang === 'tc'
          ? (p['設施名稱'] || p.Facility_Name)
          : (p.Facility_Name || p['設施名稱'])), { direction: 'top', offset: [0, -20] });
      },
      filter: (f) => f.geometry && f.geometry.type === 'Point'
    });

    // 逐個加入 cluster group
    layer.eachLayer((l) => group.addLayer(l));

    if (unmatched.length) {
      console.warn(`[空氣] 有 ${unmatched.length} 個監測站未能對應 AQHI 資料：`, unmatched);
    } else if (Array.isArray(aqhiList)) {
      console.log(`[空氣] AQHI 對照成功：${matched}/${layer.getLayers().length} 個監測站`);
    }

    state.meta.air = fmtDateTime(new Date());
    return clusterIfNeeded(group, layer.getLayers().length);
  }
